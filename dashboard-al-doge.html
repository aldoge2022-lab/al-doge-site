<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard AL DOGE</title>
<style>
body{margin:0;background:#050403;color:#f3ead9;font-family:Arial,sans-serif}.page{max-width:1120px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}h1{color:#d2ba7c;margin:0}.card{border:1px solid rgba(210,186,124,.35);background:#11100d;border-radius:18px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric strong{display:block;color:#d2ba7c;font-size:30px}.metric span{color:#b8ad9b;font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid rgba(210,186,124,.18);padding:9px;text-align:left;vertical-align:top}th{color:#d2ba7c}.winner{font-size:20px;color:#d2ba7c;font-weight:900}.btn{border:1px solid rgba(210,186,124,.4);border-radius:999px;padding:9px 12px;text-decoration:none;color:#d2ba7c;font-weight:900}.muted{color:#b8ad9b}.error{color:#ffb4a8}@media(max-width:800px){.top{display:block}.grid,.two{grid-template-columns:1fr}table{font-size:12px}}
</style>
</head>
<body>
<main class="page">
<div class="top"><div><h1>Dashboard AL DOGE</h1><p class="muted">Prenotazioni, clienti e promozioni</p></div><a class="btn" href="index.html">Torna al sito</a></div>
<div id="status" class="card">Caricamento dati...</div>
<section class="grid" id="metrics"></section>
<section class="two">
<div class="card"><h2>Pizza più votata</h2><div id="winner" class="winner">-</div><div id="votes"></div></div>
<div class="card"><h2>Ultimi clienti</h2><div id="customers"></div></div>
</section>
<section class="card"><h2>Ultime prenotazioni</h2><div id="bookings"></div></section>
<section class="card"><h2>Ultimi voti promozione</h2><div id="lastVotes"></div></section>
</main>
<script>
const fn='/' + '.' + 'netlify' + '/functions/admin-summary';
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function table(rows, cols){if(!rows||!rows.length)return '<p class="muted">Nessun dato.</p>';return '<table><thead><tr>'+cols.map(c=>'<th>'+c.label+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(typeof c.value==='function'?c.value(r):r[c.value])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
fetch(fn).then(r=>r.json()).then(data=>{if(!data.ok)throw new Error(data.error||'Errore');document.getElementById('status').innerHTML='Dati aggiornati: '+new Date(data.generated_at).toLocaleString('it-IT');document.getElementById('metrics').innerHTML=[['Prenotazioni',data.totals.bookings],['Clienti',data.totals.customers],['Consensi',data.totals.consents],['Voti',data.totals.votes]].map(m=>'<div class="card metric"><strong>'+m[1]+'</strong><span>'+m[0]+'</span></div>').join('');document.getElementById('winner').textContent=data.vote_winner?data.vote_winner.choice+' ('+data.vote_winner.votes+' voti)':'Nessun voto';document.getElementById('votes').innerHTML=table(Object.entries(data.vote_counts).map(([choice,votes])=>({choice,votes})),[{label:'Pizza',value:'choice'},{label:'Voti',value:'votes'}]);document.getElementById('customers').innerHTML=table(data.customers,[{label:'Nome',value:'full_name'},{label:'Telefono',value:'phone'}]);document.getElementById('bookings').innerHTML=table(data.bookings,[{label:'Nome',value:'full_name'},{label:'Telefono',value:'phone'},{label:'Data',value:'booking_date'},{label:'Ora',value:'booking_time'},{label:'Persone',value:'people'},{label:'Stato',value:'status'}]);document.getElementById('lastVotes').innerHTML=table(data.votes.slice(0,20),[{label:'Pizza',value:'choice'},{label:'Origine',value:'source'},{label:'Data',value:r=>new Date(r.created_at).toLocaleString('it-IT')}]);}).catch(err=>{document.getElementById('status').innerHTML='<span class="error">Errore caricamento: '+esc(err.message)+'</span>'});
</script>
</body>
</html>

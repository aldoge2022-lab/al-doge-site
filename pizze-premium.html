<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Pizze - AL DOGE</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold-soft:#efd06c;--dark:#080808;--soft:#151515;--text:#f6f1e7;--muted:#b8b1a3;--line:rgba(212,175,55,.18)}
*{margin:0;padding:0;box-sizing:border-box}body{background:radial-gradient(circle at top right,rgba(212,175,55,.08),transparent 34%),linear-gradient(180deg,#050505 0%,var(--dark) 42%,#0d0d0d 100%);color:var(--text);font-family:'Inter',sans-serif;padding-bottom:100px}.logo-fixed{position:fixed;top:18px;left:18px;z-index:999;width:62px;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.55);border:1px solid rgba(212,175,55,.22);cursor:pointer;background:#0d0d0d}.cart-fixed{position:fixed;top:18px;right:18px;z-index:999;background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#000;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer;box-shadow:0 18px 40px rgba(212,175,55,.24);transition:.25s}.cart-fixed:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 22px 48px rgba(212,175,55,.34)}.cart-badge{position:absolute;top:-5px;right:-5px;background:#d93535;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #080808}header{padding:115px 20px 46px;text-align:center;background:radial-gradient(circle at top,rgba(212,175,55,.15),transparent 42%),linear-gradient(180deg,#151515 0%,var(--dark) 100%);border-bottom:1px solid rgba(212,175,55,.12)}h1{font-family:'Playfair Display',serif;color:var(--gold);font-size:clamp(42px,6vw,64px);margin-bottom:10px;letter-spacing:-.03em}.subtitle{color:var(--muted);font-size:16px;line-height:1.6}.controls{max-width:1200px;margin:30px auto 18px;padding:0 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.search-box{flex:1;min-width:250px}.search-box input{width:100%;padding:13px 20px;border-radius:999px;border:1px solid rgba(212,175,55,.24);background:rgba(21,21,21,.88);color:var(--text);font-size:15px;outline:none}.search-box input:focus{border-color:rgba(212,175,55,.58);box-shadow:0 0 0 4px rgba(212,175,55,.08)}.search-box input::placeholder{color:var(--muted)}.filter-btn{padding:12px 20px;border-radius:999px;border:1px solid rgba(212,175,55,.24);background:rgba(21,21,21,.72);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;transition:.25s}.filter-btn:hover,.filter-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#000;border-color:var(--gold);box-shadow:0 12px 28px rgba(212,175,55,.16)}.menu-container{max-width:1200px;margin:0 auto;padding:24px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px;align-items:start}.pizza-card{background:linear-gradient(180deg,rgba(24,24,24,.96),rgba(12,12,12,.98));border-radius:24px;padding:26px;border:1px solid var(--line);transition:.25s;display:flex;flex-direction:column;align-self:start;box-shadow:0 18px 44px rgba(0,0,0,.22);position:relative;overflow:hidden}.pizza-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(212,175,55,.08),transparent 38%);opacity:0;transition:.25s;pointer-events:none}.pizza-card:hover{transform:translateY(-4px);border-color:rgba(212,175,55,.48);box-shadow:0 24px 58px rgba(0,0,0,.36),0 0 34px rgba(212,175,55,.08)}.pizza-card:hover:before{opacity:1}.pizza-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:13px;position:relative;z-index:1}.pizza-name{font-family:'Playfair Display',serif;color:var(--text);font-size:25px;line-height:1.05;font-weight:700;flex:1;letter-spacing:-.015em}.pizza-price{font-size:20px;font-weight:700;color:var(--gold);white-space:nowrap;margin-left:6px;padding:6px 10px;border-radius:999px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.16)}.pizza-ingredients{color:var(--muted);font-size:14px;line-height:1.72;margin-bottom:14px;position:relative;z-index:1}.pizza-allergeni{font-size:11px;color:rgba(255,170,170,.78);margin-bottom:14px;line-height:1.45;position:relative;z-index:1}.customize-toggle-btn{width:100%;margin-bottom:13px;padding:11px 14px;border-radius:999px;border:1px solid rgba(212,175,55,.24);background:rgba(212,175,55,.06);color:var(--gold-soft);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1;transition:.22s}.customize-toggle-btn:hover{background:rgba(212,175,55,.11);border-color:rgba(212,175,55,.45)}.customize-toggle-btn small{color:var(--muted);font-size:11px;font-weight:500}.pizza-variants{display:none;margin-bottom:15px;padding:14px;border-radius:16px;background:rgba(0,0,0,.20);border:1px solid rgba(212,175,55,.12);position:relative;z-index:1}.pizza-variants.open{display:block}.variant-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:11px}.variant-group label{display:block;font-size:11px;color:var(--gold-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.variant-group select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid rgba(212,175,55,.22);background:#090909;color:var(--text);font-size:13px;outline:none}.variant-extras{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:9px}.extra-category{border:1px solid rgba(212,175,55,.16);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.13)}.extra-category-toggle{width:100%;border:none;background:transparent;color:var(--text);display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:13px;cursor:pointer;text-align:left}.extra-category-toggle span{color:var(--muted);font-size:12px}.extra-category-toggle strong{font-size:15px;line-height:1;color:var(--gold)}.extra-category.open .extra-category-toggle{background:rgba(212,175,55,.08)}.extra-ingredients-list{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:0 10px 10px}.extra-category.open .extra-ingredients-list{display:grid}.extra-ingredient-btn{border:1px solid rgba(212,175,55,.20);background:rgba(0,0,0,.24);color:var(--text);border-radius:999px;padding:7px 10px;font-size:12px;line-height:1.2;text-align:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}.extra-ingredient-btn:hover{border-color:rgba(212,175,55,.5);background:rgba(212,175,55,.09)}.selected-extras-chips{margin-top:2px;display:flex;flex-wrap:wrap;gap:6px;min-height:22px}.extra-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(212,175,55,.32);background:rgba(212,175,55,.11);color:var(--text);border-radius:999px;padding:5px 9px;font-size:11px;line-height:1}.extra-chip-remove{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:0;line-height:1}.selected-extras-empty{color:rgba(184,177,163,.7);font-size:12px;font-style:italic}.variant-total{color:var(--gold-soft);font-size:13px;font-weight:700;text-align:right}.pizza-actions{display:flex;gap:10px;align-items:center;margin-top:auto;position:relative;z-index:1}.quantity-control{display:flex;align-items:center;gap:9px;background:#080808;border-radius:999px;padding:5px;border:1px solid rgba(212,175,55,.12)}.qty-btn{width:31px;height:31px;border-radius:50%;border:none;background:rgba(212,175,55,.92);color:#000;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}.qty-display{min-width:28px;text-align:center;font-weight:700}.add-to-cart-btn{flex:1;padding:12px 18px;border-radius:999px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#000;font-weight:800;cursor:pointer;transition:.25s;font-size:14px;box-shadow:0 12px 28px rgba(212,175,55,.16)}.add-to-cart-btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(212,175,55,.28)}.no-results{text-align:center;padding:60px 20px;color:var(--muted);font-size:18px}@media(max-width:768px){.menu-container{grid-template-columns:1fr;padding:18px}.controls{flex-direction:column;align-items:stretch}.filter-btn{width:100%}.extra-ingredients-list{grid-template-columns:1fr}.pizza-card{padding:23px;border-radius:22px}.variant-grid{grid-template-columns:1fr}.pizza-actions{align-items:stretch}.add-to-cart-btn{min-height:43px}}
</style>
</head>
<body>
<img src="logo-al-doge.png" class="logo-fixed" onclick="window.location.href='index.html'" alt="AL DOGE">
<div class="cart-fixed" onclick="window.location.href='carrello.html'" id="cart-icon">🛒<span class="cart-badge" id="cart-badge" style="display:none;">0</span></div>
<header><h1>Menu Pizze</h1><p class="subtitle">Scegli la tua pizza. Personalizza solo se vuoi.</p></header>
<div class="controls"><div class="search-box"><input type="text" id="search-input" placeholder="Cerca pizza per nome o ingrediente..."></div><button class="filter-btn active" data-filter="all">Tutte</button><button class="filter-btn" data-filter="classica">Classiche</button><button class="filter-btn" data-filter="speciale">Speciali</button><button class="filter-btn" data-filter="piccante">Piccanti</button></div>
<div class="menu-container" id="menu-container"></div><div class="no-results" id="no-results" style="display:none;">Nessuna pizza trovata con i criteri selezionati.</div>
<script src="pizza-pricing.js"></script>
<script>
let allPizzas=[];let currentFilter='all';let searchTerm='';const quantities={};const pizzaExtrasState={};
const EXTRA_CATEGORIES=Object.freeze([{key:'verdure',label:'Verdure',priceLabel:'+€1,50',ingredients:['Funghi freschi','Funghi porcini','Carciofi','Peperoni','Cipolla','Patate al forno','Patatine','Rucola','Pomodorini','Zucchine','Spinaci','Radicchio di Treviso','Melanzane','Asparagi','Fagioli','Olive nere','Olive verdi','Olive taggiasche','Pomodori secchi','Capperi','Friarielli','Noci']},{key:'affettati',label:'Affettati',priceLabel:'+€2,00',ingredients:['Prosciutto cotto','Prosciutto crudo San Daniele','Bresaola','Speck','Pancetta','Salamino piccante','Wurstel','Salsiccia','Salame dolce','Petto d\'oca','Acciughe','Tonno','Salmone','Salmone affumicato','Gamberetti','Frutti di mare']},{key:'burrata-bufala',label:'Burrata / bufala',priceLabel:'+€3,00',ingredients:['Burrata','Mozzarella di bufala']}]);
const EXTRA_CATEGORY_MAP=EXTRA_CATEGORIES.reduce((a,c)=>(a[c.key]=c,a),{});
function escapeHtml(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function getPizzaKey(n){return btoa(encodeURIComponent(n)).replace(/=+$/g,'')}
function getPizzaExtrasState(n){if(!pizzaExtrasState[n])pizzaExtrasState[n]={openCategory:null,selectedExtras:[],format:'normale',dough:'normale',customizeOpen:false};return pizzaExtrasState[n]}
function hasCustomSelection(s){return s.format!=='normale'||s.dough!=='normale'||s.selectedExtras.length>0}
function renderExtraCategories(n,k){const s=getPizzaExtrasState(n);return EXTRA_CATEGORIES.map(c=>{const open=s.openCategory===c.key;return `<div class="extra-category ${open?'open':''}" id="extra-category-${k}-${c.key}"><button type="button" class="extra-category-toggle" onclick="toggleExtraCategory('${n}','${c.key}')"><span>${c.label} (${c.priceLabel})</span><strong>${open?'−':'+'}</strong></button><div class="extra-ingredients-list" id="extra-list-${k}-${c.key}">${c.ingredients.map((i,idx)=>`<button type="button" class="extra-ingredient-btn" onclick="selectExtraIngredient('${n}','${c.key}',${idx})" title="${escapeHtml(i)}">${escapeHtml(i)}</button>`).join('')}</div></div>`}).join('')}
function renderSelectedExtrasChips(n){const s=getPizzaExtrasState(n);if(!s.selectedExtras.length)return '<span class="selected-extras-empty">Nessuna aggiunta selezionata</span>';return s.selectedExtras.map((e,i)=>`<span class="extra-chip">${escapeHtml(e.name)}<button type="button" class="extra-chip-remove" onclick="removeExtraIngredient('${n}',${i})" aria-label="Rimuovi ${escapeHtml(e.name)}">×</button></span>`).join('')}
function calculateSelectionFinalPrice(base,v){return base+(PizzaPricing.FORMAT_SURCHARGES[v.format]||0)+(PizzaPricing.DOUGH_SURCHARGES[v.dough]||0)+v.selectedExtras.reduce((s,e)=>s+(PizzaPricing.EXTRA_SURCHARGES[e.categoryKey]||0),0)}
async function loadMenu(){try{const r=await fetch('/.netlify/functions/catalog');const d=await r.json();allPizzas=Array.isArray(d.items)?d.items:[];displayPizzas()}catch(e){console.error(e);document.getElementById('menu-container').innerHTML='<p style="text-align:center;color:var(--muted);">Errore nel caricamento del catalogo</p>'}}
function getSelectedVariant(n){const s=getPizzaExtrasState(n);return{format:s.format||'normale',dough:s.dough||'normale',extras:s.selectedExtras.map(e=>e.categoryKey),selectedExtras:s.selectedExtras.map(e=>({...e})),extraIngredients:s.selectedExtras.map(e=>e.name)}}
function displayPizzas(){const c=document.getElementById('menu-container'),no=document.getElementById('no-results');let f=allPizzas;if(currentFilter!=='all')f=f.filter(p=>p.category===currentFilter);if(searchTerm)f=f.filter(p=>p.name.toLowerCase().includes(searchTerm.toLowerCase())||p.ingredients.some(i=>i.toLowerCase().includes(searchTerm.toLowerCase())));if(!f.length){c.innerHTML='';no.style.display='block';return}no.style.display='none';c.innerHTML=f.map(p=>{const k=getPizzaKey(p.name),s=getPizzaExtrasState(p.name),custom=hasCustomSelection(s);return `<div class="pizza-card" data-pizza-id="${p.id}"><div class="pizza-header"><h3 class="pizza-name">${p.name}</h3><div class="pizza-price" id="price-${k}">€${p.price.toFixed(2)}</div></div><div class="pizza-ingredients">${p.ingredients.join(', ')}</div><div class="pizza-allergeni">⚠️ Allergeni: ${Array.isArray(p.allergens)?p.allergens.join(', '):''}</div><button type="button" class="customize-toggle-btn" onclick="toggleCustomize('${p.name}')"><span>${s.customizeOpen?'Nascondi personalizzazione':'Personalizza pizza'}</span><small>${custom?'Modifiche attive':'Impasto e aggiunte'}</small></button><div class="pizza-variants ${s.customizeOpen?'open':''}"><div class="variant-grid"><div class="variant-group"><label for="format-${k}">Formato</label><select id="format-${k}" onchange="handleFormatChange('${p.name}',this.value)"><option value="normale" ${s.format==='normale'?'selected':''}>Normale (prezzo base)</option><option value="maxi" ${s.format==='maxi'?'selected':''}>Maxi (+€5,00)</option></select></div><div class="variant-group"><label for="dough-${k}">Impasto</label><select id="dough-${k}" onchange="handleDoughChange('${p.name}',this.value)"><option value="normale" ${s.dough==='normale'?'selected':''}>Normale (+€0,00)</option><option value="farina-di-riso" ${s.dough==='farina-di-riso'?'selected':''}>Farina di riso (+€1,50)</option><option value="kamut" ${s.dough==='kamut'?'selected':''}>Kamut (+€1,50)</option></select></div></div><div class="variant-extras">${renderExtraCategories(p.name,k)}<div class="selected-extras-chips" id="selected-extras-${k}">${renderSelectedExtrasChips(p.name)}</div></div><div class="variant-total" id="variant-total-${k}">Prezzo selezione: €${p.price.toFixed(2)}</div></div><div class="pizza-actions"><div class="quantity-control"><button class="qty-btn" onclick="changeQuantity('${p.name}',-1)">−</button><span class="qty-display" id="qty-${k}">${quantities[p.name]||1}</span><button class="qty-btn" onclick="changeQuantity('${p.name}',1)">+</button></div><button class="add-to-cart-btn" onclick="addToCart('${p.name}',event)">🛒 Aggiungi</button></div></div>`}).join('');f.forEach(p=>updatePizzaSelectionPrice(p.name))}
function updatePizzaSelectionPrice(n){const p=allPizzas.find(x=>x.name===n);if(!p||!window.PizzaPricing)return;const k=getPizzaKey(n),v=getSelectedVariant(n),final=calculateSelectionFinalPrice(p.price,v),hp=document.getElementById(`price-${k}`),vp=document.getElementById(`variant-total-${k}`);if(hp)hp.textContent=`€${final.toFixed(2)}`;if(vp)vp.textContent=`Prezzo selezione: €${final.toFixed(2)}`}
function toggleCustomize(n){const s=getPizzaExtrasState(n);s.customizeOpen=!s.customizeOpen;displayPizzas()}
function toggleExtraCategory(n,cat){const s=getPizzaExtrasState(n);s.openCategory=s.openCategory===cat?null:cat;s.customizeOpen=true;displayPizzas()}
function handleFormatChange(n,v){const s=getPizzaExtrasState(n);s.format=v||'normale';updatePizzaSelectionPrice(n)}
function handleDoughChange(n,v){const s=getPizzaExtrasState(n);s.dough=v||'normale';updatePizzaSelectionPrice(n)}
function selectExtraIngredient(n,cat,idx){const c=EXTRA_CATEGORY_MAP[cat];if(!c)return;const name=c.ingredients[idx];if(!name)return;const s=getPizzaExtrasState(n);if(!s.selectedExtras.some(e=>e.name===name))s.selectedExtras.push({categoryKey:cat,name});s.openCategory=null;s.customizeOpen=true;displayPizzas()}
function removeExtraIngredient(n,idx){const s=getPizzaExtrasState(n);s.selectedExtras=s.selectedExtras.filter((_,i)=>i!==idx);s.customizeOpen=true;displayPizzas()}
function changeQuantity(n,d){const id=getPizzaKey(n);if(!quantities[n])quantities[n]=1;quantities[n]=Math.max(1,Math.min(99,quantities[n]+d));document.getElementById(`qty-${id}`).textContent=quantities[n]}
function addToCart(n,e){const p=allPizzas.find(x=>x.name===n);if(!p)return;const q=quantities[n]||1,v=getSelectedVariant(n),labels=PizzaPricing.getVariantLabels({format:v.format,dough:v.dough,extras:[]}),final=calculateSelectionFinalPrice(p.price,v),extrasSig=v.selectedExtras.map(x=>`${x.categoryKey}:${x.name}`).join('|')||'Nessuno',sig=`${labels.format}::${labels.dough}::${extrasSig}`;let cart=JSON.parse(localStorage.getItem('aldoge_cart')||'[]');const idx=cart.findIndex(item=>item.type==='pizza'&&item.name===n&&(item.variantSignature||PizzaPricing.DEFAULT_VARIANT_SIGNATURE)===sig);if(idx!==-1)cart[idx].quantity+=q;else cart.push({type:'pizza',name:n,basePrice:p.price,format:labels.format,dough:labels.dough,extras:v.extraIngredients,variantSignature:sig,price:final,ingredients:p.ingredients,allergeni:p.allergens,quantity:q});localStorage.setItem('aldoge_cart',JSON.stringify(cart));quantities[n]=1;document.getElementById(`qty-${getPizzaKey(n)}`).textContent='1';const btn=e?e.target:null;if(btn){const t=btn.innerHTML;btn.innerHTML='✓ Aggiunto!';btn.style.background='#4CAF50';setTimeout(()=>{btn.innerHTML=t;btn.style.background=''},1500)}updateCartBadge()}
function updateCartBadge(){const cart=JSON.parse(localStorage.getItem('aldoge_cart')||'[]'),total=cart.reduce((s,i)=>s+i.quantity,0),badge=document.getElementById('cart-badge');if(total>0){badge.textContent=total;badge.style.display='flex'}else badge.style.display='none'}
document.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;displayPizzas()}));document.getElementById('search-input').addEventListener('input',e=>{searchTerm=e.target.value;displayPizzas()});loadMenu();updateCartBadge();
</script>
</body>
</html>

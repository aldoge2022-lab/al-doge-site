<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Tavolo - AL DOGE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#d4af37; --dark:#0b0b0b; --soft:#1a1a1a; --text:#f5f5f5; --muted:#b3b3b3; --ok:#4CAF50; --warn:#ffcf7a; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--dark); color:var(--text); font-family:Inter,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .container { max-width:500px; width:100%; background:var(--soft); border-radius:20px; padding:34px 26px; text-align:center; border:2px solid rgba(212,175,55,.3); }
    .logo { width:105px; height:105px; border-radius:18px; margin:0 auto 22px; box-shadow:0 5px 20px rgba(212,175,55,.25); object-fit:cover; }
    h1 { font-family:'Playfair Display',serif; color:var(--gold); font-size:34px; margin-bottom:10px; }
    .table-number { display:inline-block; background:var(--gold); color:#000; padding:9px 24px; border-radius:999px; font-size:22px; font-weight:700; margin-bottom:22px; }
    .subtitle { color:var(--muted); font-size:15px; margin-bottom:18px; }
    .box { background:rgba(212,175,55,.1); border:1px solid rgba(212,175,55,.3); border-radius:12px; padding:14px; margin-top:14px; text-align:left; color:var(--muted); font-size:14px; }
    .status { display:none; color:var(--text); font-weight:600; text-align:center; }
    .status.show { display:block; }
    .status.ok { color:var(--ok); }
    .status.warn { color:var(--warn); }
    .bill-row, .payable-row { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
    .bill-row strong, .payable-value { color:var(--gold); font-weight:700; }
    #bill-items { margin:10px 0 0; padding-left:18px; }
    #bill-items li { margin:4px 0; }
    .payment-modes { margin-top:16px; display:grid; gap:10px; text-align:left; }
    .mode-option { border:1px solid rgba(212,175,55,.3); border-radius:12px; padding:12px; background:rgba(212,175,55,.05); display:flex; gap:10px; align-items:center; cursor:pointer; }
    .mode-option input { accent-color:var(--gold); width:18px; height:18px; }
    .split-controls { display:none; margin-top:12px; gap:10px; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .split-controls.show { display:grid; }
    .split-field label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
    .split-field select { width:100%; border-radius:8px; border:1px solid rgba(212,175,55,.3); background:var(--dark); color:var(--text); padding:10px; font-size:15px; }
    .payable-box { margin-top:16px; border-radius:12px; border:1px solid rgba(212,175,55,.3); background:rgba(212,175,55,.1); padding:14px; text-align:left; }
    .payable-label { font-size:14px; color:var(--muted); }
    .payable-value { font-size:25px; }
    .detail { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.35; }
    .pay-button { width:100%; padding:18px; border-radius:14px; border:none; background:var(--gold); color:#000; font-size:19px; font-weight:700; cursor:pointer; margin-top:12px; }
    .pay-button:disabled { opacity:.5; cursor:not-allowed; }
    .success-message { display:none; padding:28px 10px; }
    .success-message.show { display:block; }
    .success-icon { font-size:70px; margin-bottom:16px; }
    .success-text { font-size:24px; color:var(--ok); font-weight:700; margin-bottom:12px; }
    .success-detail { color:var(--muted); font-size:16px; line-height:1.45; }
    @media(max-width:480px){ .container{padding:28px 18px}.split-controls{grid-template-columns:1fr}.logo{width:92px;height:92px} }
  </style>
</head>
<body>
  <div class="container">
    <div id="payment-form">
      <img src="logo-al-doge.png" class="logo" alt="AL DOGE">
      <h1>AL DOGE</h1>
      <div class="table-number">Tavolo <span id="table-number">-</span></div>
      <p class="subtitle">Conto del tavolo</p>

      <div id="bill-status" class="box status"></div>

      <div id="bill-details" class="box" style="display:none;">
        <div class="bill-row"><span>Totale da pagare</span><strong id="bill-total">--</strong></div>
        <div id="bill-note" class="detail" style="display:none;"></div>
        <div id="bill-payment-code" class="detail" style="display:none;"></div>
        <ul id="bill-items"></ul>
      </div>

      <div class="payment-modes">
        <label class="mode-option"><input type="radio" name="payment-mode" value="full" checked><span>Pagamento unico</span></label>
        <label class="mode-option"><input type="radio" name="payment-mode" value="split"><span>Pagamento diviso</span></label>
      </div>

      <div class="split-controls" id="split-controls">
        <div class="split-field"><label for="split-count">Numero quote</label><select id="split-count"></select></div>
        <div class="split-field"><label for="split-index">Quota da pagare</label><select id="split-index"></select></div>
      </div>

      <div class="payable-box">
        <div class="payable-row"><span class="payable-label">Importo pagabile</span><span class="payable-value" id="payable-amount">€0.00</span></div>
        <div id="payable-detail" class="detail"></div>
      </div>

      <button class="pay-button" onclick="processPayment()" id="pay-btn" disabled>💳 Paga Ora</button>
      <div class="box">ℹ️ Pagamento sicuro tramite Stripe. Il personale verrà notificato immediatamente.</div>
    </div>

    <div class="success-message" id="success-message">
      <div class="success-icon">✓</div>
      <div class="success-text" id="success-title">Pagamento completato</div>
      <div class="success-detail" id="success-detail">Grazie per aver scelto AL DOGE</div>
      <div class="box" style="text-align:center;margin-top:24px;">Il personale è stato notificato del pagamento.</div>
    </div>
  </div>

  <script>
    const TABLE_BILL_ENDPOINT = '/.netlify/functions/table-bill';
    const TABLE_PAYMENT_ENDPOINT = '/.netlify/functions/table-payment';
    const SPLIT_MIN_SHARES = 2;
    const SPLIT_MAX_SHARES = 12;

    let tableNumber = null;
    let selectedAmount = 0;
    let currentBill = null;
    let paymentMode = 'full';
    let splitShares = 2;
    let splitShareIndex = 1;

    function getReturnState() {
      const params = new URLSearchParams(location.search);
      return { paymentStatus: params.get('payment'), sessionId: params.get('session_id') };
    }

    function clearReturnState() {
      const current = new URL(location.href);
      current.searchParams.delete('payment');
      current.searchParams.delete('session_id');
      history.replaceState({}, '', `${current.pathname}${current.search}`);
    }

    function getTableNumber() {
      const params = new URLSearchParams(location.search);
      return String(params.get('table') || params.get('tableNumber') || params.get('t') || '').trim() || null;
    }

    function formatCurrency(amount) {
      const value = Number(amount);
      return Number.isFinite(value) ? `€${value.toFixed(2)}` : '€0.00';
    }

    function roundToCents(value) {
      return Math.round((Number(value) + Number.EPSILON) * 100);
    }

    function showBillStatus(message, type = '') {
      const status = document.getElementById('bill-status');
      status.textContent = message;
      status.className = `box status show ${type}`;
    }

    function showFormError(message) {
      document.getElementById('payment-form').innerHTML = `<div style="padding:40px;text-align:center;"><div style="font-size:60px;margin-bottom:20px;">⚠️</div><div style="color:var(--muted);font-size:18px;">${message}</div></div>`;
    }

    function getItemTotal(item) {
      if (!item || typeof item !== 'object') return 0;
      if (Number.isFinite(Number(item.total))) return Number(item.total);
      if (Number.isFinite(Number(item.subtotal))) return Number(item.subtotal);
      const qty = Number(item.qty ?? item.quantity ?? 1);
      const price = Number(item.price ?? item.unitPrice ?? 0);
      return Number.isFinite(qty) && Number.isFinite(price) ? qty * price : 0;
    }

    function getMinimumSplitShares() {
      const remainingShares = Number.parseInt(currentBill?.remainingShares, 10);
      const isLastSplitShare = currentBill?.paymentMode === 'split' && currentBill?.paymentStatus === 'partial' && remainingShares === 1;
      return isLastSplitShare ? 1 : SPLIT_MIN_SHARES;
    }

    function calculateSplitAmount(total, shares, index) {
      const totalCents = roundToCents(total);
      const safeShares = Math.max(getMinimumSplitShares(), Number.parseInt(shares, 10) || splitShares);
      const safeIndex = Math.min(safeShares, Math.max(1, Number.parseInt(index, 10) || splitShareIndex));
      const baseShare = Math.floor(totalCents / safeShares);
      const remainder = totalCents % safeShares;
      return (baseShare + (safeIndex <= remainder ? 1 : 0)) / 100;
    }

    function rebuildSplitCountOptions() {
      const splitCountEl = document.getElementById('split-count');
      const minShares = getMinimumSplitShares();
      const existing = Number.parseInt(splitCountEl.value, 10) || splitShares;
      const currentValue = Math.max(minShares, Math.min(SPLIT_MAX_SHARES, existing));
      splitCountEl.innerHTML = '';
      for (let shares = minShares; shares <= SPLIT_MAX_SHARES; shares += 1) {
        const option = document.createElement('option');
        option.value = String(shares);
        option.textContent = shares === 1 ? '1 quota rimasta' : `${shares} quote`;
        splitCountEl.appendChild(option);
      }
      splitCountEl.value = String(currentValue);
      splitShares = currentValue;
    }

    function refreshSplitShareOptions() {
      const splitCountEl = document.getElementById('split-count');
      const splitIndexEl = document.getElementById('split-index');
      const minShares = getMinimumSplitShares();
      const parsed = Number.parseInt(splitCountEl.value, 10);
      splitShares = Number.isInteger(parsed) ? Math.max(minShares, Math.min(SPLIT_MAX_SHARES, parsed)) : minShares;
      const max = splitShares;
      const currentIndex = Math.min(max, Math.max(1, Number.parseInt(splitIndexEl.value, 10) || 1));
      splitIndexEl.innerHTML = '';
      for (let idx = 1; idx <= max; idx += 1) {
        const option = document.createElement('option');
        option.value = String(idx);
        option.textContent = max === 1 ? 'Ultima quota' : `Quota ${idx} di ${max}`;
        splitIndexEl.appendChild(option);
      }
      splitIndexEl.value = String(currentIndex);
      splitShareIndex = currentIndex;
    }

    function updatePayableAmount() {
      const total = Number(currentBill?.total);
      const valid = Number.isFinite(total) && total > 0;
      const splitControls = document.getElementById('split-controls');
      const detail = document.getElementById('payable-detail');
      splitControls.classList.toggle('show', paymentMode === 'split');

      if (!valid) {
        selectedAmount = 0;
        document.getElementById('payable-amount').textContent = formatCurrency(0);
        detail.textContent = 'Nessun importo disponibile';
        document.getElementById('pay-btn').disabled = true;
        return;
      }

      if (paymentMode === 'full') {
        selectedAmount = total;
        detail.textContent = 'Pagamento unico: saldo completo del tavolo';
      } else {
        const remainingShares = Number.parseInt(currentBill?.remainingShares, 10);
        const isSplitContinuation = currentBill?.paymentMode === 'split' && Number.isInteger(remainingShares) && remainingShares > 0;
        const effectiveShares = isSplitContinuation ? remainingShares : splitShares;
        selectedAmount = calculateSplitAmount(total, effectiveShares, Math.min(splitShareIndex, effectiveShares));
        detail.textContent = effectiveShares === 1
          ? 'Pagamento diviso: ultima quota rimasta'
          : `Pagamento diviso: quota ${Math.min(splitShareIndex, effectiveShares)} di ${effectiveShares}`;
      }

      document.getElementById('payable-amount').textContent = formatCurrency(selectedAmount);
      document.getElementById('pay-btn').disabled = selectedAmount <= 0;
    }

    function renderBill(bill) {
      currentBill = bill;
      const mode = String(bill?.paymentMode || '').trim().toLowerCase();
      const status = String(bill?.paymentStatus || '').trim().toLowerCase();
      const totalShares = Number.parseInt(bill?.totalShares, 10);
      const remainingShares = Number.parseInt(bill?.remainingShares, 10);

      if (mode === 'split') {
        paymentMode = 'split';
        splitShares = status === 'partial' && Number.isInteger(remainingShares) && remainingShares > 0
          ? Math.max(1, Math.min(SPLIT_MAX_SHARES, remainingShares))
          : Math.max(SPLIT_MIN_SHARES, Math.min(SPLIT_MAX_SHARES, totalShares || SPLIT_MIN_SHARES));
        splitShareIndex = 1;
      }

      tableNumber = String(bill?.tableNumber ?? tableNumber);
      document.getElementById('table-number').textContent = tableNumber;
      document.getElementById('bill-total').textContent = formatCurrency(bill?.total);
      document.getElementById('bill-details').style.display = 'block';

      const noteEl = document.getElementById('bill-note');
      noteEl.style.display = bill?.note ? 'block' : 'none';
      noteEl.textContent = bill?.note ? `Nota: ${bill.note}` : '';

      const paymentCodeEl = document.getElementById('bill-payment-code');
      paymentCodeEl.style.display = bill?.paymentCode ? 'block' : 'none';
      paymentCodeEl.textContent = bill?.paymentCode ? `Codice pagamento: ${bill.paymentCode}` : '';

      const items = Array.isArray(bill?.items) ? bill.items : [];
      const itemsEl = document.getElementById('bill-items');
      itemsEl.style.display = items.length ? 'block' : 'none';
      itemsEl.innerHTML = items.map((item) => {
        const qty = Number(item?.qty ?? item?.quantity ?? 1);
        const name = item?.name || 'Voce conto';
        return `<li>${qty}x ${name} - ${formatCurrency(getItemTotal(item))}</li>`;
      }).join('');

      rebuildSplitCountOptions();
      refreshSplitShareOptions();
      document.querySelectorAll('input[name="payment-mode"]').forEach((input) => { input.checked = input.value === paymentMode; });
      updatePayableAmount();
    }

    async function loadBillForTable(table) {
      const res = await fetch(`${TABLE_BILL_ENDPOINT}?table=${encodeURIComponent(table)}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Errore caricamento conto (${res.status})`);
      const payload = await res.json();
      if (!payload || payload.ok !== true) throw new Error('Risposta conto non valida');

      if (payload.empty === true) {
        currentBill = payload.bill || null;
        showBillStatus('Nessun conto aperto per questo tavolo', 'ok');
        document.getElementById('bill-details').style.display = 'none';
        document.getElementById('pay-btn').disabled = true;
        return payload;
      }

      if (!payload.bill || typeof payload.bill !== 'object') throw new Error('Conto mancante nella risposta');
      renderBill(payload.bill);
      return payload;
    }

    function setupModeControls() {
      rebuildSplitCountOptions();
      refreshSplitShareOptions();
      document.querySelectorAll('input[name="payment-mode"]').forEach((input) => {
        input.addEventListener('change', (event) => {
          paymentMode = event.target.value === 'split' ? 'split' : 'full';
          updatePayableAmount();
        });
      });
      document.getElementById('split-count').addEventListener('change', () => { refreshSplitShareOptions(); updatePayableAmount(); });
      document.getElementById('split-index').addEventListener('change', (event) => { splitShareIndex = Math.max(1, Number.parseInt(event.target.value, 10) || 1); updatePayableAmount(); });
    }

    function showPaymentSuccess(amount, title = 'Pagamento completato') {
      document.getElementById('success-title').textContent = title;
      document.getElementById('success-detail').innerHTML = `Grazie per aver scelto AL DOGE<br>Importo: <span style="color:var(--gold);font-weight:700;">${formatCurrency(amount)}</span>`;
      document.getElementById('payment-form').style.display = 'none';
      document.getElementById('success-message').classList.add('show');
    }

    async function verifyStripePayment(sessionId) {
      const response = await fetch(TABLE_PAYMENT_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'confirm', sessionId, tableNumber })
      });
      const data = await response.json().catch(() => null);
      if (!response.ok || !data || data.ok !== true || data.paid !== true) throw new Error('Pagamento Stripe non confermato');
      return data;
    }

    async function processPayment() {
      if (selectedAmount <= 0) { alert('Importo non disponibile'); return; }
      const btn = document.getElementById('pay-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Elaborazione...';
      try {
        const response = await fetch(TABLE_PAYMENT_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tableNumber, paymentMode, splitShares, splitShareIndex })
        });
        const data = await response.json().catch(() => null);
        if (!response.ok || !data || data.ok !== true || typeof data.checkoutUrl !== 'string') throw new Error('Sessione Stripe non valida');
        location.assign(data.checkoutUrl);
      } catch (error) {
        console.error('Errore pagamento:', error);
        alert('Errore nel processare il pagamento. Riprova.');
        btn.disabled = false;
        btn.textContent = '💳 Paga Ora';
      }
    }

    async function handleSuccessfulReturn(sessionId) {
      const btn = document.getElementById('pay-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Verifica pagamento...';
      showBillStatus('Verifica pagamento Stripe in corso...', 'warn');

      const confirmed = await verifyStripePayment(sessionId);
      const paidAmount = Number(confirmed?.payableAmount);
      const safePaidAmount = Number.isFinite(paidAmount) && paidAmount > 0 ? paidAmount : selectedAmount;
      const wasSplit = confirmed?.paymentMode === 'split';
      clearReturnState();

      if (wasSplit) {
        const refreshed = await loadBillForTable(tableNumber);
        const updatedBill = refreshed?.bill || currentBill;
        const remainingTotal = Number(updatedBill?.total ?? updatedBill?.remainingTotal ?? 0);
        const remainingShares = Number.parseInt(updatedBill?.remainingShares, 10) || 0;
        const paymentStatus = String(updatedBill?.paymentStatus || '').toLowerCase();

        if (paymentStatus === 'partial' && remainingTotal > 0) {
          showBillStatus(`Quota pagata: ${formatCurrency(safePaidAmount)}. Restano ${remainingShares} quota${remainingShares === 1 ? '' : 'e'} da pagare.`, 'ok');
          btn.disabled = false;
          btn.textContent = '💳 Paga prossima quota';
          updatePayableAmount();
          return;
        }
      }

      showPaymentSuccess(safePaidAmount, 'Pagamento completato');
    }

    async function init() {
      tableNumber = getTableNumber();
      if (!tableNumber) { showFormError('Tavolo non specificato'); return; }
      document.getElementById('table-number').textContent = tableNumber;
      setupModeControls();

      try {
        await loadBillForTable(tableNumber);
      } catch (error) {
        console.error('Errore caricamento conto:', error);
        showFormError('Errore nel caricamento del conto. Riprova tra poco.');
        return;
      }

      updatePayableAmount();
      const returnState = getReturnState();

      if (returnState.paymentStatus === 'cancelled') {
        showBillStatus('Pagamento annullato. Nessun addebito effettuato.', 'warn');
        clearReturnState();
        return;
      }

      if (returnState.paymentStatus === 'success' && returnState.sessionId) {
        try {
          await handleSuccessfulReturn(returnState.sessionId);
        } catch (error) {
          console.error('Errore verifica pagamento Stripe:', error);
          showBillStatus('Pagamento non ancora confermato. Se l\'addebito risulta effettuato, contatta il personale.', 'warn');
          const btn = document.getElementById('pay-btn');
          btn.disabled = false;
          btn.textContent = '💳 Paga Ora';
        }
      }
    }

    init();
  </script>
</body>
</html>

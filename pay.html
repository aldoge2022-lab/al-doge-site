<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Tavolo - AL DOGE</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --gold: #d4af37;
      --dark: #0b0b0b;
      --soft: #1a1a1a;
      --text: #f5f5f5;
      --muted: #b3b3b3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: var(--soft);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      border: 2px solid rgba(212, 175, 55, 0.3);
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      margin: 0 auto 30px;
      box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: 36px;
      margin-bottom: 10px;
    }

    .table-number {
      display: inline-block;
      background: var(--gold);
      color: black;
      padding: 10px 30px;
      border-radius: 25px;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 40px;
    }

    .custom-amount {
      margin-bottom: 30px;
    }

    .amount-input-container {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .currency-symbol {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      font-size: 24px;
      font-weight: 600;
    }

    .amount-input {
      width: 100%;
      padding: 20px 20px 20px 50px;
      border-radius: 12px;
      border: 2px solid rgba(212, 175, 55, 0.3);
      background: var(--dark);
      color: var(--text);
      font-size: 32px;
      font-weight: 600;
      text-align: center;
    }

    .amount-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .pay-button {
      width: 100%;
      padding: 20px;
      border-radius: 12px;
      border: none;
      background: var(--gold);
      color: black;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .pay-button:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
    }

    .pay-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .success-message {
      display: none;
      padding: 30px;
    }

    .success-message.show {
      display: block;
    }

    .success-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .success-text {
      font-size: 24px;
      color: #4CAF50;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .success-detail {
      color: var(--muted);
      font-size: 16px;
    }

    .info-box {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      font-size: 14px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

    }
  </style>
</head>

<body>
  <div class="container">
    <div id="payment-form">
      <img src="logo-al-doge.png" class="logo" alt="AL DOGE">
      
      <h1>AL DOGE</h1>
      <div class="table-number">Tavolo <span id="table-number">-</span></div>
      <p class="subtitle">Conto del tavolo</p>
      <div id="bill-status" class="info-box" style="margin-top: 0; display: none;"></div>
      <div id="bill-details" class="info-box" style="margin-top: 12px; display: none; text-align: left;">
        <div style="display:flex;justify-content:space-between;gap:8px;font-weight:600;color:#fff;">
          <span>Totale conto</span>
          <span id="bill-total">--</span>
        </div>
        <div id="bill-note" style="display:none;margin-top:8px;font-size:13px;"></div>
        <div id="bill-payment-code" style="display:none;margin-top:8px;font-size:13px;"></div>
        <ul id="bill-items" style="margin:10px 0 0;padding-left:18px;"></ul>
      </div>

      <!-- Custom Amount -->
      <div class="custom-amount">
        <div class="amount-input-container">
          <span class="currency-symbol">€</span>
          <input 
            type="number" 
            class="amount-input" 
            id="custom-amount" 
            placeholder="0.00"
            step="0.01"
            min="0"
            oninput="onAmountChange()"
          >
        </div>
      </div>

      <!-- Pay Button -->
      <button class="pay-button" onclick="processPayment()" id="pay-btn" disabled>
        💳 Paga Ora
      </button>

      <div class="info-box">
        ℹ️ Pagamento sicuro tramite Stripe. Il personale verrà notificato immediatamente.
      </div>
    </div>

    <!-- Success Message -->
    <div class="success-message" id="success-message">
      <div class="success-icon">✓</div>
      <div class="success-text">Pagamento Completato!</div>
      <div class="success-detail">
        Grazie per aver scelto AL DOGE<br>
        Importo: <span style="color: var(--gold); font-weight: 600;">€<span id="paid-amount">0.00</span></span>
      </div>
      <div class="info-box" style="margin-top: 30px;">
        Il personale è stato notificato del tuo pagamento
      </div>
    </div>
  </div>

  <script>
    const TABLE_BILL_ENDPOINT = '/.netlify/functions/table-bill';
    let tableNumber = null;
    let selectedAmount = 0;
    let currentBill = null;

    // Ottieni numero tavolo da URL
    function getTableNumber() {
      const params = new URLSearchParams(window.location.search);
      const table =
        params.get('table') ||
        params.get('tableNumber') ||
        params.get('t');

      if (!table) {
        return null;
      }

      return String(table).trim();
    }

    function formatCurrency(amount) {
      const value = Number(amount);
      if (!Number.isFinite(value)) {
        return '€0.00';
      }
      return `€${value.toFixed(2)}`;
    }

    function showBillStatus(message) {
      const status = document.getElementById('bill-status');
      status.style.display = 'block';
      status.textContent = message;
    }

    function showFormError(message) {
      document.getElementById('payment-form').innerHTML = `
        <div style="padding: 40px; text-align: center;">
          <div style="font-size: 60px; margin-bottom: 20px;">⚠️</div>
          <div style="color: var(--muted); font-size: 18px;">
            ${message}
          </div>
        </div>
      `;
    }

    function getItemTotal(item) {
      if (!item || typeof item !== 'object') {
        return 0;
      }
      if (Number.isFinite(Number(item.total))) {
        return Number(item.total);
      }
      const qty = Number(item.qty ?? item.quantity ?? 1);
      const price = Number(item.price ?? item.unitPrice ?? 0);
      if (Number.isFinite(qty) && Number.isFinite(price)) {
        return qty * price;
      }
      return 0;
    }

    function renderBill(bill) {
      currentBill = bill;
      const safeTableNumber = bill?.tableNumber ?? tableNumber;
      tableNumber = String(safeTableNumber);
      document.getElementById('table-number').textContent = safeTableNumber;

      const total = Number(bill?.total);
      document.getElementById('bill-total').textContent = formatCurrency(total);
      document.getElementById('bill-details').style.display = 'block';

      const noteEl = document.getElementById('bill-note');
      if (bill?.note) {
        noteEl.textContent = `Nota: ${bill.note}`;
        noteEl.style.display = 'block';
      } else {
        noteEl.style.display = 'none';
      }

      const paymentCodeEl = document.getElementById('bill-payment-code');
      if (bill?.paymentCode) {
        paymentCodeEl.textContent = `Codice pagamento: ${bill.paymentCode}`;
        paymentCodeEl.style.display = 'block';
      } else {
        paymentCodeEl.style.display = 'none';
      }

      const billItems = Array.isArray(bill?.items) ? bill.items : [];
      const itemsEl = document.getElementById('bill-items');
      if (billItems.length === 0) {
        itemsEl.style.display = 'none';
        itemsEl.innerHTML = '';
      } else {
        itemsEl.style.display = 'block';
        itemsEl.innerHTML = billItems.map((item) => {
          const qty = Number(item?.qty ?? item?.quantity ?? 1);
          const itemName = item?.name || 'Voce conto';
          const itemTotal = getItemTotal(item);
          return `<li>${qty}x ${itemName} - ${formatCurrency(itemTotal)}</li>`;
        }).join('');
      }

      if (Number.isFinite(total) && total > 0) {
        selectedAmount = total;
        document.getElementById('custom-amount').value = total.toFixed(2);
        document.getElementById('pay-btn').disabled = false;
      } else {
        document.getElementById('pay-btn').disabled = true;
      }
    }

    async function loadBillForTable(table) {
      const res = await fetch(`${TABLE_BILL_ENDPOINT}?table=${encodeURIComponent(table)}`, { cache: 'no-store' });
      if (!res.ok) {
        throw new Error(`Errore caricamento conto (${res.status})`);
      }

      const payload = await res.json();
      if (!payload || payload.ok !== true) {
        throw new Error('Risposta conto non valida');
      }

      if (payload.empty === true) {
        showBillStatus('Nessun conto aperto per questo tavolo');
        document.getElementById('pay-btn').disabled = true;
        return;
      }

      if (!payload.bill || typeof payload.bill !== 'object') {
        throw new Error('Conto mancante nella risposta');
      }

      renderBill(payload.bill);
    }

    // Ottieni importo iniziale da URL (amount, fallback total/price)
    function getInitialAmount() {
      const params = new URLSearchParams(window.location.search);
      const rawAmount = params.get('amount') ?? params.get('total') ?? params.get('price');

      if (rawAmount === null) {
        return null;
      }

      const normalizedAmount = rawAmount.trim().replace(',', '.');
      const amount = parseFloat(normalizedAmount);

      if (!Number.isFinite(amount) || amount <= 0) {
        return null;
      }

      return amount;
    }

    function onAmountChange() {
      const input = document.getElementById('custom-amount');
      const amount = parseFloat(input.value) || 0;
      
      selectedAmount = amount;

      // Abilita/disabilita bottone
      document.getElementById('pay-btn').disabled = amount <= 0;
    }

    async function processPayment() {
      if (selectedAmount <= 0) {
        alert('Inserisci un importo valido');
        return;
      }

      const btn = document.getElementById('pay-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Elaborazione...';

      try {
        // Crea ordine
        const order = {
          orderId: Date.now(),
          timestamp: new Date().toISOString(),
          tableNumber: tableNumber,
          total: selectedAmount.toFixed(2),
          status: 'paid',
          type: 'table_payment',
          name: `Tavolo ${tableNumber}`,
          phone: '-',
          address: `Tavolo ${tableNumber}`,
          items: Array.isArray(currentBill?.items) && currentBill.items.length > 0
            ? currentBill.items
            : [
                {
                  name: `Pagamento tavolo ${tableNumber}`,
                  qty: 1,
                  price: selectedAmount
                }
              ]
        };

        // Invia notifica Telegram
        const notifyResponse = await fetch('/.netlify/functions/telegram-notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(order)
        });

        if (!notifyResponse.ok) {
          throw new Error('Errore invio notifica Telegram');
        }

        // Mostra successo
        document.getElementById('paid-amount').textContent = selectedAmount.toFixed(2);
        document.getElementById('payment-form').style.display = 'none';
        document.getElementById('success-message').classList.add('show');

      } catch (error) {
        console.error('Errore pagamento:', error);
        alert('Errore nel processare il pagamento. Riprova.');
        btn.disabled = false;
        btn.textContent = '💳 Paga Ora';
      }
    }

    // Inizializza
    async function init() {
      tableNumber = getTableNumber();
      if (!tableNumber) {
        showFormError('Tavolo non specificato');
        return;
      }

      document.getElementById('table-number').textContent = tableNumber;

      try {
        await loadBillForTable(tableNumber);
      } catch (error) {
        console.error('Errore caricamento conto:', error);
        showFormError('Errore nel caricamento del conto. Riprova tra poco.');
        return;
      }

      const billTotal = Number(currentBill?.total);
      const initialAmount = getInitialAmount();
      if ((!Number.isFinite(billTotal) || billTotal <= 0) && initialAmount !== null) {
        document.getElementById('custom-amount').value = initialAmount.toFixed(2);
        onAmountChange();
      }
    }

    init();
  </script>
</body>
</html>

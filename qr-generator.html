<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generatore QR Code - AL DOGE</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" 
          integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" 
          crossorigin="anonymous" 
          referrerpolicy="no-referrer"></script>
  
  <style>
    :root {
      --gold: #d4af37;
      --dark: #0b0b0b;
      --soft: #1a1a1a;
      --text: #f5f5f5;
      --muted: #b3b3b3;
      --paper: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: 42px;
      text-align: center;
      margin-bottom: 40px;
    }

    .intro {
      text-align: center;
      color: var(--muted);
      margin-bottom: 50px;
      font-size: 18px;
    }

    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
    }

    .qr-card {
      background: linear-gradient(170deg, #1f1f1f 0%, #151515 100%);
      border-radius: 18px;
      padding: 28px 24px 24px;
      text-align: center;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.35);
    }

    .table-number {
      font-size: 27px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 18px;
      letter-spacing: 0.3px;
    }

    .qr-code {
      position: relative;
      background: white;
      padding: 24px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border: 1px solid #e8e8e8;
    }

    .qr-code canvas,
    .qr-code img {
      display: block;
    }

    .qr-logo {
      position: absolute;
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 50%;
      background: var(--paper);
      border: 3px solid var(--paper);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.24);
      z-index: 2;
      pointer-events: none;
    }

    .qr-caption {
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .qr-caption-brand {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .qr-caption-action {
      display: block;
      font-size: 15px;
      color: #d4d4d4;
      margin-top: 3px;
    }

    .qr-caption-table {
      display: block;
      margin-top: 4px;
      font-size: 18px;
      font-weight: 600;
      color: var(--gold);
    }

    .qr-url {
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      margin-bottom: 14px;
    }

    .download-btn {
      padding: 12px 25px;
      background: var(--gold);
      border: none;
      border-radius: 10px;
      color: black;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .download-btn:hover {
      transform: scale(1.05);
    }

    .print-all {
      text-align: center;
      margin: 50px 0 30px;
    }

    .print-btn {
      padding: 15px 40px;
      background: var(--gold);
      border: none;
      border-radius: 10px;
      color: black;
      font-weight: 600;
      font-size: 18px;
      cursor: pointer;
    }

    @media print {
      body {
        background: white;
        padding: 14mm;
      }

      .print-all, .intro, h1 {
        display: none;
      }

      .container {
        max-width: none;
      }

      .qr-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10mm;
      }

      .qr-card {
        page-break-inside: avoid;
        border: 1px solid #333;
        background: white;
        color: black;
        box-shadow: none;
        border-radius: 12px;
        padding: 8mm 6mm 6mm;
      }

      .table-number {
        color: black;
      }

      .qr-caption-brand,
      .qr-caption-action,
      .qr-caption-table {
        color: black;
      }

      .qr-url {
        color: #666;
        font-size: 10px;
      }

      .download-btn {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📱 Generatore QR Code Tavoli</h1>
    <p class="intro">
      QR Code per pagamento al tavolo - Scansiona e paga direttamente dal telefono
    </p>

    <div class="print-all">
      <button class="print-btn" onclick="window.print()">🖨️ Stampa Tutti i QR Code</button>
    </div>

    <div class="qr-grid" id="qr-grid"></div>
  </div>

  <script>
    // Ottieni l'URL base del sito
    const BASE_URL = window.location.origin;

    // Genera QR code per 10 tavoli
    function generateQRCodes() {
      const grid = document.getElementById('qr-grid');
      
      for (let i = 1; i <= 10; i++) {
        const payUrl = new URL('/pay.html', BASE_URL);
        payUrl.searchParams.set('table', String(i));
        const url = payUrl.toString();
        
        const card = document.createElement('div');
        card.className = 'qr-card';
        card.innerHTML = `
          <div class="table-number">Tavolo ${i}</div>
          <div class="qr-code" id="qr-${i}"></div>
          <div class="qr-caption">
            <span class="qr-caption-brand">AL DOGE</span>
            <span class="qr-caption-action">Scansiona per pagare</span>
            <span class="qr-caption-table">Tavolo ${i}</span>
          </div>
          <div class="qr-url">${url}</div>
          <button class="download-btn" onclick="downloadQR(${i})">⬇️ Scarica PNG</button>
        `;
        
        grid.appendChild(card);
        
        // Genera QR code
        const qrContainer = document.getElementById(`qr-${i}`);
        new QRCode(qrContainer, {
          text: url,
          width: 260,
          height: 260,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });

        // Logo centrato con dimensione contenuta per mantenere alta scansionabilita'
        const logo = document.createElement('img');
        logo.src = '/logo-al-doge.png';
        logo.alt = 'Logo AL DOGE';
        logo.className = 'qr-logo';
        qrContainer.appendChild(logo);
      }
    }

    function downloadQR(tableNumber) {
      const qrContainer = document.getElementById(`qr-${tableNumber}`);
      const canvas = qrContainer.querySelector('canvas');
      
      if (canvas) {
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = canvas.width;
        exportCanvas.height = canvas.height;
        const ctx = exportCanvas.getContext('2d');
        ctx.drawImage(canvas, 0, 0);

        const logo = new Image();
        logo.onload = () => {
          const logoSize = Math.round(canvas.width * 0.2);
          const logoX = Math.round((canvas.width - logoSize) / 2);
          const logoY = Math.round((canvas.height - logoSize) / 2);
          const badgePadding = 4;
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;
          const badgeRadius = (logoSize / 2) + badgePadding;
          const logoRadius = logoSize / 2;

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(centerX, centerY, badgeRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.save();
          ctx.beginPath();
          ctx.arc(centerX, centerY, logoRadius, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(logo, logoX, logoY, logoSize, logoSize);
          ctx.restore();

          const url = exportCanvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = url;
          a.download = `aldoge-tavolo-${tableNumber}.png`;
          a.click();
        };

        logo.src = '/logo-al-doge.png';
      }
    }

    // Genera i QR code al caricamento
    generateQRCodes();
  </script>
</body>
</html>

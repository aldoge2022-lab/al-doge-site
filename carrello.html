<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrello - AL DOGE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#b99c62;--gold-soft:#d2ba7c;--dark:#080706;--soft:#15130f;--text:#f3ead9;--muted:#b8ad9b;--line:rgba(185,156,98,.22);--danger:#8f2b2b}
    *{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(180deg,#050403,var(--dark));color:var(--text);font-family:'Inter',sans-serif;padding-bottom:80px}.topbar{position:sticky;top:0;z-index:50;background:rgba(8,7,6,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.logo-fixed{width:48px;height:48px;object-fit:cover;border:1px solid rgba(185,156,98,.32);background:#0d0b08;border-radius:12px}.brand strong{display:block;font-family:'Playfair Display',serif;color:var(--gold-soft);font-size:23px}.brand span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.top-actions{display:flex;gap:8px}.top-actions a{border:1px solid var(--line);color:var(--text);padding:9px 12px;font-size:13px;font-weight:700;text-decoration:none;border-radius:999px}.top-actions a.primary{background:var(--gold);border-color:var(--gold);color:#080706}header{padding:42px 20px 26px;text-align:center;border-bottom:1px solid rgba(185,156,98,.12)}h1{font-family:'Playfair Display',serif;color:var(--gold-soft);font-size:clamp(32px,5vw,48px);margin-bottom:8px}.subtitle{color:var(--muted);font-size:15px}.container{max-width:860px;margin:0 auto;padding:20px}.empty-cart{text-align:center;padding:42px 20px}.empty-cart-icon{font-size:48px;margin-bottom:14px;opacity:.65}.empty-cart-text{color:var(--muted);font-size:18px;margin-bottom:22px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 26px;background:var(--gold);color:#080706;text-decoration:none;font-weight:700;border:1px solid var(--gold);min-height:48px;border-radius:14px}.cart-items{margin-bottom:18px}.cart-item{background:var(--soft);padding:16px;margin-bottom:12px;border:1px solid var(--line);border-radius:16px}.item-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.item-info{flex:1}.item-type{display:inline-block;background:rgba(185,156,98,.14);color:var(--gold-soft);padding:4px 8px;font-size:11px;font-weight:700;margin-bottom:7px;text-transform:uppercase;border-radius:999px}.item-name{font-size:18px;font-weight:700;color:var(--text);margin-bottom:7px}.item-ingredients{font-size:13px;color:var(--muted);margin-bottom:7px;line-height:1.45}.item-allergeni{font-size:11px;color:rgba(200,190,170,.78);border-left:2px solid rgba(185,156,98,.34);padding:6px 8px;background:rgba(255,255,255,.035)}.item-variant{font-size:12px;color:var(--muted);margin-bottom:3px}.item-remove{background:transparent;color:#d8c7aa;border:1px solid rgba(185,156,98,.32);width:34px;height:34px;cursor:pointer;font-size:16px;border-radius:999px}.item-remove:hover{background:rgba(143,43,43,.2);border-color:var(--danger)}.item-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.quantity-control{display:flex;align-items:center;gap:10px;background:#090807;padding:5px;border:1px solid rgba(185,156,98,.18);border-radius:999px}.qty-btn{width:30px;height:30px;border:none;background:var(--gold);color:#080706;font-size:17px;cursor:pointer;font-weight:700;border-radius:999px}.qty-display{min-width:26px;text-align:center;font-weight:700;font-size:16px}.item-price{font-size:21px;font-weight:700;color:var(--gold-soft)}.summary-box{background:var(--soft);padding:20px;border:1px solid var(--gold);margin-bottom:16px;border-radius:16px}.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(185,156,98,.18)}.summary-row:last-child{border-bottom:none;padding-top:14px;margin-top:6px;border-top:1px solid var(--gold)}.summary-label{color:var(--muted);font-size:15px}.summary-value{font-weight:700;font-size:15px}.summary-total .summary-label{color:var(--gold-soft);font-size:20px}.summary-total .summary-value{color:var(--gold-soft);font-size:26px}.allergens-box{background:rgba(255,255,255,.035);border:1px solid rgba(185,156,98,.22);padding:13px;margin-bottom:16px;border-radius:14px}.allergens-title{color:var(--gold-soft);font-weight:700;margin-bottom:6px}.allergens-list{color:var(--muted);font-size:13px}.upsell-box{background:linear-gradient(180deg,rgba(24,22,18,.92),rgba(12,10,8,.96));border:1px solid var(--line);padding:18px;margin:18px 0;border-radius:18px}.upsell-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}.upsell-head h2{font-family:'Playfair Display',serif;color:var(--gold-soft);font-size:26px;line-height:1}.upsell-head p{color:var(--muted);font-size:13px;line-height:1.4;margin-top:5px}.upsell-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}.upsell-tab{border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--text);padding:8px 11px;font-size:12px;font-weight:800;border-radius:999px;white-space:nowrap;cursor:pointer}.upsell-tab.active{background:var(--gold);border-color:var(--gold);color:#080706}.upsell-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.upsell-item{border:1px solid rgba(185,156,98,.16);background:rgba(0,0,0,.18);padding:12px;border-radius:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.upsell-name{font-weight:800;font-size:14px;color:var(--text)}.upsell-note{display:block;color:var(--muted);font-size:12px;margin-top:3px}.upsell-price{color:var(--gold-soft);font-weight:900;font-size:14px;margin-bottom:7px;text-align:right}.upsell-add{border:0;background:var(--gold);color:#080706;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;cursor:pointer}.action-buttons{display:grid;grid-template-columns:1fr 1.7fr;gap:12px;margin-top:16px}.btn-secondary,.btn-primary{padding:14px;border:1px solid var(--gold);font-weight:700;cursor:pointer;min-height:50px;font-size:15px;border-radius:14px}.btn-secondary{background:transparent;color:var(--gold-soft)}.btn-primary{background:var(--gold);color:#080706}.btn-primary:hover,.btn-secondary:hover,.upsell-add:hover{filter:brightness(1.05)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;background:#14110d;border:1px solid rgba(185,156,98,.42);color:var(--text);padding:12px 16px;border-radius:999px;box-shadow:0 22px 60px rgba(0,0,0,.45);font-size:13px;font-weight:800;z-index:80;transition:.22s ease}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:768px){.topbar{align-items:flex-start}.top-actions{flex-direction:column}.top-actions a{font-size:12px;padding:8px 10px}.container{padding:16px}.item-header{align-items:flex-start}.item-controls{align-items:center}.action-buttons{grid-template-columns:1fr}.summary-total .summary-value{font-size:24px}.upsell-head{display:block}.upsell-grid{grid-template-columns:1fr}.upsell-box{padding:15px}.upsell-head h2{font-size:24px}}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html"><video class="logo-fixed" autoplay loop muted playsinline poster="logo-al-doge.png"><source src="logo-animato.mp4" type="video/mp4"></video><div><strong>AL DOGE</strong><span>Carrello</span></div></a>
    <div class="top-actions"><a href="pizze.html">← Continua ordine</a><a class="primary" href="index.html">Home</a></div>
  </div>
  <header><h1>Il tuo carrello</h1><p class="subtitle">Controlla l'ordine prima di procedere.</p></header>
  <div class="container">
    <div class="empty-cart" id="empty-cart" style="display:none"><div class="empty-cart-icon">🛒</div><div class="empty-cart-text">Il carrello è vuoto</div><a href="pizze.html" class="btn">Torna al menù</a></div>
    <div id="cart-content" style="display:none"><div class="cart-items" id="cart-items"></div><div class="upsell-box" id="upsell-box"><div class="upsell-head"><div><h2>Vuoi aggiungere qualcosa?</h2><p>Bibite, birre e dolci da asporto.</p></div></div><div class="upsell-tabs" id="upsell-tabs"></div><div class="upsell-grid" id="upsell-grid"></div></div><div class="allergens-box" id="allergens-box" style="display:none"><div class="allergens-title">Allergeni presenti</div><div class="allergens-list" id="allergens-list"></div></div><div class="summary-box"><div class="summary-row"><span class="summary-label">Articoli</span><span class="summary-value" id="total-items">0</span></div><div class="summary-row summary-total"><span class="summary-label">Totale</span><span class="summary-value" id="total-price">€0.00</span></div></div><div class="action-buttons"><button class="btn-secondary" onclick="clearCart()">Svuota carrello</button><button class="btn-primary" onclick="goToCheckout()">Procedi al checkout</button></div></div>
  </div>
  <div class="toast" id="toast">Aggiunto al carrello</div>
  <script src="cart-utils.js"></script>
  <script>
    const EXTRAS_CATEGORIES=[
      {key:'bibite',label:'Bibite',items:[
        {name:'Coca-Cola',note:'lattina',price:2.50},{name:'Coca-Cola Zero',note:'lattina',price:2.50},{name:'Fanta',note:'lattina',price:2.50},{name:'Sprite',note:'lattina',price:2.50},{name:'Tè pesca / limone',note:'0,33 L',price:2.50},{name:'Lemonsoda',note:'lattina',price:2.50},{name:'Tonica',note:'lattina',price:2.50},{name:'Acqua naturale',note:'0,5 L',price:1.00},{name:'Acqua frizzante',note:'0,5 L',price:1.00}
      ]},
      {key:'birre',label:'Birre',items:[
        {name:'Spaten',note:'50 cl',price:4.50},{name:'Forst Sixtus',note:'33 cl',price:3.50},{name:'Bitburger Pilsner',note:'33 cl',price:3.00},{name:'Weihenstephaner',note:'50 cl',price:5.50},{name:'Brooklyn Session IPA',note:'33 cl',price:4.00}
      ]},
      {key:'dolci',label:'Dolci e gelati',items:[
        {name:'Tiramisù fatto in casa',note:'dolce',price:5.00},{name:'Catalana fatta in casa',note:'dolce',price:5.00},{name:'Panna cotta',note:'dolce',price:5.00},{name:'Gelato al pistacchio',note:'gelato',price:4.00},{name:'Gelato al cioccolato',note:'gelato',price:4.00},{name:'Gelato alla vaniglia',note:'gelato',price:4.00}
      ]}
    ];
    let activeExtraCategory='bibite';
    function euro(value){return '€'+Number(value||0).toFixed(2).replace('.',',')}
    function safe(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
    function showToast(text){const toast=document.getElementById('toast');toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}
    function loadCart(){const cart=CartManager.getCart();const emptyCart=document.getElementById('empty-cart');const cartContent=document.getElementById('cart-content');if(cart.length===0){emptyCart.style.display='block';cartContent.style.display='none';return}emptyCart.style.display='none';cartContent.style.display='block';renderCartItems(cart);renderUpsell();renderAllergens(cart);updateSummary(cart)}
    function typeLabel(item){if(item.type==='pizza')return 'Pizza';if(item.type==='drink')return 'Bibita';if(item.type==='beer')return 'Birra';if(item.type==='dessert')return 'Dolce';if(item.type==='gelato')return 'Gelato';return 'Articolo'}
    function renderCartItems(cart){const container=document.getElementById('cart-items');container.innerHTML=cart.map((item,index)=>{const itemTotal=(Number(item.price)||0)*(Number(item.quantity)||0);const extrasLabel=Array.isArray(item.extras)&&item.extras.length?item.extras.join(', '):'Nessuno';const formatLabel=item.format||'Normale';const doughLabel=item.dough||'Normale';const variantMarkup=item.type==='pizza'?`<div class="item-variant">Formato: ${safe(formatLabel)}</div><div class="item-variant">Impasto: ${safe(doughLabel)}</div><div class="item-variant">Extra: ${safe(extrasLabel)}</div>`:(item.note?`<div class="item-variant">${safe(item.note)}</div>`:'');const ingredients=Array.isArray(item.ingredients)?item.ingredients:[];const allergeni=Array.isArray(item.allergeni)?item.allergeni:[];return `<div class="cart-item"><div class="item-header"><div class="item-info"><span class="item-type">${typeLabel(item)}</span><div class="item-name">${safe(item.name)}</div>${variantMarkup}${ingredients.length?`<div class="item-ingredients">${ingredients.map(safe).join(', ')}</div>`:''}${allergeni.length?`<div class="item-allergeni">Allergeni: ${allergeni.map(safe).join(', ')}</div>`:''}</div><button class="item-remove" onclick="removeItem(${index})" title="Rimuovi">×</button></div><div class="item-controls"><div class="quantity-control"><button class="qty-btn" onclick="updateQuantity(${index}, ${item.quantity-1})">−</button><span class="qty-display">${item.quantity}</span><button class="qty-btn" onclick="updateQuantity(${index}, ${item.quantity+1})">+</button></div><div class="item-price">${euro(itemTotal)}</div></div></div>`}).join('')}
    function renderUpsell(){const tabs=document.getElementById('upsell-tabs');const grid=document.getElementById('upsell-grid');tabs.innerHTML=EXTRAS_CATEGORIES.map(cat=>`<button type="button" class="upsell-tab ${activeExtraCategory===cat.key?'active':''}" onclick="activeExtraCategory='${cat.key}';renderUpsell()">${cat.label}</button>`).join('');const cat=EXTRAS_CATEGORIES.find(c=>c.key===activeExtraCategory)||EXTRAS_CATEGORIES[0];grid.innerHTML=cat.items.map((item,i)=>`<div class="upsell-item"><div><div class="upsell-name">${safe(item.name)}</div><span class="upsell-note">${safe(item.note)}</span></div><div><div class="upsell-price">${euro(item.price)}</div><button class="upsell-add" onclick="addExtraItem('${cat.key}',${i})">Aggiungi</button></div></div>`).join('')}
    function addExtraItem(categoryKey,index){const cat=EXTRAS_CATEGORIES.find(c=>c.key===categoryKey);if(!cat||!cat.items[index])return;const item=cat.items[index];const type=categoryKey==='bibite'?'drink':categoryKey==='birre'?'beer':item.note==='gelato'?'gelato':'dessert';const cart=CartManager.getCart();const signature=`${type}:${item.name}:${item.note}`;const existing=cart.findIndex(x=>(x.variantSignature||'')===signature);if(existing!==-1){cart[existing].quantity=(Number(cart[existing].quantity)||0)+1}else{cart.push({type,name:item.name,note:item.note,variantSignature:signature,price:item.price,quantity:1,ingredients:[],allergeni:[]})}localStorage.setItem('aldoge_cart',JSON.stringify(cart));showToast(`${item.name} aggiunto`);loadCart()}
    function renderAllergens(cart){let allergens=[];if(window.CartManager&&typeof CartManager.getAllergens==='function'){allergens=CartManager.getAllergens()}const allergensBox=document.getElementById('allergens-box');const allergensList=document.getElementById('allergens-list');if(allergens.length>0){allergensBox.style.display='block';allergensList.textContent=`Presenti allergeni: ${allergens.join(', ')}`}else{allergensBox.style.display='none'}}
    function updateSummary(cart){const totalItems=cart.reduce((sum,item)=>sum+(Number(item.quantity)||0),0);const totalPrice=cart.reduce((sum,item)=>sum+((Number(item.price)||0)*(Number(item.quantity)||0)),0);document.getElementById('total-items').textContent=totalItems;document.getElementById('total-price').textContent=euro(totalPrice)}
    function updateQuantity(index,newQuantity){if(newQuantity<1){if(confirm('Vuoi rimuovere questo articolo dal carrello?')){CartManager.removeItem(index)}}else{CartManager.updateQuantity(index,newQuantity)}loadCart()}
    function removeItem(index){if(confirm('Sei sicuro di voler rimuovere questo articolo?')){CartManager.removeItem(index);loadCart()}}
    function clearCart(){if(confirm('Sei sicuro di voler svuotare il carrello?')){CartManager.clearCart();loadCart()}}
    function goToCheckout(){const cart=CartManager.getCart();if(cart.length===0){alert('Il carrello è vuoto!');return}window.location.href='checkout.html'}
    loadCart();
  </script>
</body>
</html>

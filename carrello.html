<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrello - AL DOGE</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#b99c62;--gold2:#d2ba7c;--bg:#080706;--panel:#15130f;--text:#f3ead9;--muted:#b8ad9b;--line:rgba(185,156,98,.24);--danger:#8f2b2b}*{box-sizing:border-box;margin:0;padding:0}body{background:linear-gradient(180deg,#050403,var(--bg));color:var(--text);font-family:Inter,sans-serif;padding-bottom:64px}a{text-decoration:none;color:inherit}.topbar{position:sticky;top:0;z-index:20;background:rgba(8,7,6,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{display:flex;gap:10px;align-items:center}.brand video{width:42px;height:42px;object-fit:cover;border:1px solid var(--line);border-radius:10px}.brand strong{display:block;font-family:'Playfair Display',serif;color:var(--gold2);font-size:21px}.brand span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions a{border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800}.top-actions a.primary{background:var(--gold);border-color:var(--gold);color:#080706}header{padding:26px 18px 18px;text-align:center;border-bottom:1px solid rgba(185,156,98,.12)}h1{font-family:'Playfair Display',serif;color:var(--gold2);font-size:clamp(31px,5vw,44px);line-height:1}.subtitle{color:var(--muted);font-size:14px;margin-top:6px}.container{max-width:760px;margin:0 auto;padding:16px}.empty-cart{text-align:center;padding:42px 20px}.empty-cart-icon{font-size:42px;margin-bottom:12px;opacity:.65}.empty-cart-text{color:var(--muted);font-size:17px;margin-bottom:20px}.btn{display:inline-flex;justify-content:center;align-items:center;min-height:45px;padding:12px 24px;background:var(--gold);border:1px solid var(--gold);color:#080706;font-weight:900;border-radius:14px}.receipt{background:rgba(18,16,12,.94);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}.receipt-title{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px dashed rgba(185,156,98,.28);margin-bottom:2px}.receipt-title h2{font-size:15px;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase}.receipt-title span{font-size:12px;color:var(--muted)}.receipt-line{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(185,156,98,.18)}.receipt-line:last-child{border-bottom:0}.item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}.item-type{background:rgba(185,156,98,.13);color:var(--gold2);padding:3px 7px;font-size:9px;font-weight:900;text-transform:uppercase;border-radius:999px}.item-name{font-size:15px;font-weight:900;color:var(--text)}.item-details{font-size:12px;color:var(--muted);line-height:1.35}.line-right{display:grid;grid-template-columns:auto auto auto;gap:8px;align-items:center;justify-content:end;align-self:start}.qty-mini{display:flex;align-items:center;gap:5px;border:1px solid rgba(185,156,98,.2);background:#090807;border-radius:999px;padding:3px}.qty-btn{width:22px;height:22px;border:0;background:var(--gold);color:#080706;font-size:14px;font-weight:900;border-radius:999px;cursor:pointer}.qty-display{min-width:18px;text-align:center;font-size:13px;font-weight:900}.item-price{font-size:16px;font-weight:900;color:var(--gold2);min-width:62px;text-align:right}.item-remove{background:transparent;color:#d8c7aa;border:1px solid rgba(185,156,98,.32);width:24px;height:24px;cursor:pointer;font-size:13px;border-radius:999px}.item-remove:hover{background:rgba(143,43,43,.2);border-color:var(--danger)}.summary-box{background:var(--panel);padding:15px;border:1px solid var(--gold);margin-bottom:14px;border-radius:15px}.summary-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed rgba(185,156,98,.22)}.summary-row:last-child{border-bottom:0;padding-top:11px;margin-top:4px;border-top:1px solid var(--gold)}.summary-label{color:var(--muted);font-size:14px}.summary-value{font-weight:800}.summary-total .summary-label{color:var(--gold2);font-size:19px}.summary-total .summary-value{color:var(--gold2);font-size:24px}.upsell-box{background:linear-gradient(180deg,rgba(24,22,18,.92),rgba(12,10,8,.96));border:1px solid var(--line);padding:14px;margin:16px 0;border-radius:18px}.upsell-head{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}.upsell-head h2{font-family:'Playfair Display',serif;color:var(--gold2);font-size:23px;line-height:1}.upsell-sign{font-size:25px;color:var(--gold2);font-weight:900}.upsell-tabs{display:none;gap:9px;overflow-x:auto;padding-bottom:6px;margin:14px 0 0}.upsell-grid{display:none;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.upsell-box.open .upsell-tabs{display:flex}.upsell-box.open.has-category .upsell-grid{display:grid}.upsell-tab{border:1px solid var(--line);background:rgba(0,0,0,.22);color:#fff;padding:10px 15px;font-size:15px;font-weight:900;border-radius:999px;white-space:nowrap;cursor:pointer}.upsell-tab.active{background:var(--gold);border-color:var(--gold);color:#080706}.upsell-item{border:1px solid rgba(185,156,98,.16);background:rgba(0,0,0,.18);padding:10px;border-radius:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.upsell-name{font-weight:800;font-size:13px}.upsell-note{display:block;color:var(--muted);font-size:11px;margin-top:3px}.upsell-price{color:var(--gold2);font-weight:900;font-size:13px;margin-bottom:7px;text-align:right}.upsell-add{border:0;background:var(--gold);color:#080706;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;cursor:pointer}.action-buttons{display:grid;grid-template-columns:1fr 1.7fr;gap:12px;margin-top:16px}.btn-secondary,.btn-primary{padding:14px;border:1px solid var(--gold);font-weight:900;cursor:pointer;min-height:50px;font-size:15px;border-radius:14px}.btn-secondary{background:transparent;color:var(--gold2)}.btn-primary{background:var(--gold);color:#080706}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;background:#14110d;border:1px solid rgba(185,156,98,.42);padding:12px 16px;border-radius:999px;box-shadow:0 22px 60px rgba(0,0,0,.45);font-size:13px;font-weight:800;z-index:80;transition:.22s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:768px){.topbar{align-items:flex-start}.top-actions{flex-direction:column}.container{padding:14px}.receipt-line{grid-template-columns:1fr}.line-right{justify-content:start}.action-buttons{grid-template-columns:1fr}.upsell-grid{grid-template-columns:1fr}.upsell-tab{font-size:15px;padding:10px 14px}}
</style>
</head>
<body>
<div class="topbar"><a class="brand" href="index.html"><video autoplay loop muted playsinline poster="logo-al-doge.png"><source src="logo-animato.mp4" type="video/mp4"></video><div><strong>AL DOGE</strong><span>Carrello</span></div></a><div class="top-actions"><a href="menu-semplice.html">← Continua ordine</a><a class="primary" href="index.html">Home</a></div></div>
<header><h1>Il tuo carrello</h1><p class="subtitle">Riepilogo rapido dell'ordine.</p></header>
<div class="container"><div class="empty-cart" id="empty-cart" style="display:none"><div class="empty-cart-icon">🛒</div><div class="empty-cart-text">Il carrello è vuoto</div><a href="menu-semplice.html" class="btn">Torna al menù</a></div><div id="cart-content" style="display:none"><div class="receipt" id="cart-items"></div><div class="upsell-box open" id="upsell-box"><div class="upsell-head" onclick="toggleUpsell()"><h2>Vuoi aggiungere qualcosa?</h2><div class="upsell-sign" id="upsell-sign">−</div></div><div class="upsell-tabs" id="upsell-tabs"></div><div class="upsell-grid" id="upsell-grid"></div></div><div class="summary-box"><div class="summary-row"><span class="summary-label">Articoli</span><span class="summary-value" id="total-items">0</span></div><div class="summary-row summary-total"><span class="summary-label">Totale</span><span class="summary-value" id="total-price">€0,00</span></div></div><div class="action-buttons"><button class="btn-secondary" onclick="clearCart()">Svuota carrello</button><button class="btn-primary" onclick="goToCheckout()">Procedi al checkout</button></div></div></div><div class="toast" id="toast">Aggiunto al carrello</div>
<script src="cart-utils.js"></script>
<script>
const EXTRAS_CATEGORIES=[{key:'bibite',label:'Bibite',items:[{name:'Coca-Cola',note:'lattina',price:2.50},{name:'Coca-Cola Zero',note:'lattina',price:2.50},{name:'Fanta',note:'lattina',price:2.50},{name:'Sprite',note:'lattina',price:2.50},{name:'Tè pesca / limone',note:'0,33 L',price:2.50},{name:'Lemonsoda',note:'lattina',price:2.50},{name:'Tonica',note:'lattina',price:2.50},{name:'Acqua naturale',note:'0,5 L',price:1.00},{name:'Acqua frizzante',note:'0,5 L',price:1.00}]},{key:'birre',label:'Birre',items:[{name:'Spaten',note:'50 cl',price:4.50},{name:'Forst Sixtus',note:'33 cl',price:3.50},{name:'Bitburger Pilsner',note:'33 cl',price:3.00},{name:'Weihenstephaner',note:'50 cl',price:5.50},{name:'Brooklyn Session IPA',note:'33 cl',price:4.00}]},{key:'dolci',label:'Dolci e gelati',items:[{name:'Tiramisù fatto in casa',note:'dolce',price:5.00},{name:'Catalana fatta in casa',note:'dolce',price:5.00},{name:'Panna cotta',note:'dolce',price:5.00},{name:'Gelato al pistacchio',note:'gelato',price:4.00},{name:'Gelato al cioccolato',note:'gelato',price:4.00},{name:'Gelato alla vaniglia',note:'gelato',price:4.00}]}];
let activeExtraCategory=null,upsellOpen=true;
function euro(v){return '€'+Number(v||0).toFixed(2).replace('.',',')}function safe(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
function typeLabel(i){if(i.type==='pizza')return'Pizza';if(i.type==='panino')return'Panino';if(i.type==='drink')return'Bibita';if(i.type==='beer')return'Birra';if(i.type==='dessert')return'Dolce';if(i.type==='gelato')return'Gelato';return'Articolo'}
function metaText(item){const p=[];if(item.type==='pizza'){if(item.format)p.push('Formato: '+item.format);if(item.dough)p.push('Impasto: '+item.dough);if(Array.isArray(item.extras)&&item.extras.length)p.push('Extra: '+item.extras.join(', '));}else if(item.note){p.push(item.note)}return p.join(' · ')}
function loadCart(){const cart=CartManager.getCart(),empty=document.getElementById('empty-cart'),content=document.getElementById('cart-content');if(!cart.length){empty.style.display='block';content.style.display='none';return}empty.style.display='none';content.style.display='block';renderCartItems(cart);renderUpsell();updateSummary(cart)}
function renderCartItems(cart){const total=cart.reduce((s,i)=>s+(Number(i.quantity)||0),0);document.getElementById('cart-items').innerHTML=`<div class="receipt-title"><h2>Articoli</h2><span>${total} pezzi</span></div>`+cart.map((item,index)=>{const ingredients=Array.isArray(item.ingredients)?item.ingredients:[];const details=[ingredients.length?ingredients.join(', '):'',metaText(item)].filter(Boolean).join(' · ');return `<div class="receipt-line"><div><div class="item-top"><span class="item-type">${typeLabel(item)}</span><span class="item-name">${safe(item.name)}</span></div>${details?`<div class="item-details">${safe(details)}</div>`:''}</div><div class="line-right"><div class="qty-mini"><button class="qty-btn" onclick="updateQuantity(${index},${item.quantity-1})">−</button><span class="qty-display">${item.quantity}</span><button class="qty-btn" onclick="updateQuantity(${index},${item.quantity+1})">+</button></div><div class="item-price">${euro((Number(item.price)||0)*(Number(item.quantity)||0))}</div><button class="item-remove" onclick="removeItem(${index})" title="Rimuovi">×</button></div></div>`}).join('')}
function toggleUpsell(){upsellOpen=!upsellOpen;if(!upsellOpen)activeExtraCategory=null;renderUpsell()}function openCategory(k){activeExtraCategory=activeExtraCategory===k?null:k;renderUpsell()}
function renderUpsell(){const box=document.getElementById('upsell-box'),sign=document.getElementById('upsell-sign'),tabs=document.getElementById('upsell-tabs'),grid=document.getElementById('upsell-grid');box.classList.toggle('open',upsellOpen);box.classList.toggle('has-category',Boolean(activeExtraCategory));sign.textContent=upsellOpen?'−':'+';tabs.innerHTML=EXTRAS_CATEGORIES.map(c=>`<button type="button" class="upsell-tab ${activeExtraCategory===c.key?'active':''}" onclick="openCategory('${c.key}')">${c.label}</button>`).join('');if(!activeExtraCategory){grid.innerHTML='';return}const cat=EXTRAS_CATEGORIES.find(c=>c.key===activeExtraCategory)||EXTRAS_CATEGORIES[0];grid.innerHTML=cat.items.map((item,i)=>`<div class="upsell-item"><div><div class="upsell-name">${safe(item.name)}</div><span class="upsell-note">${safe(item.note)}</span></div><div><div class="upsell-price">${euro(item.price)}</div><button class="upsell-add" onclick="addExtraItem('${cat.key}',${i})">Aggiungi</button></div></div>`).join('')}
function addExtraItem(categoryKey,index){const cat=EXTRAS_CATEGORIES.find(c=>c.key===categoryKey);if(!cat||!cat.items[index])return;const item=cat.items[index],type=categoryKey==='bibite'?'drink':categoryKey==='birre'?'beer':item.note==='gelato'?'gelato':'dessert',cart=CartManager.getCart(),signature=`${type}:${item.name}:${item.note}`,existing=cart.findIndex(x=>(x.variantSignature||'')===signature);if(existing!==-1)cart[existing].quantity=(Number(cart[existing].quantity)||0)+1;else cart.push({type,name:item.name,note:item.note,variantSignature:signature,price:item.price,quantity:1,ingredients:[],allergeni:[]});localStorage.setItem('aldoge_cart',JSON.stringify(cart));showToast(`${item.name} aggiunto`);loadCart()}
function updateSummary(cart){document.getElementById('total-items').textContent=cart.reduce((s,i)=>s+(Number(i.quantity)||0),0);document.getElementById('total-price').textContent=euro(cart.reduce((s,i)=>s+((Number(i.price)||0)*(Number(i.quantity)||0)),0))}
function updateQuantity(index,newQuantity){if(newQuantity<1){if(confirm('Vuoi rimuovere questo articolo dal carrello?'))CartManager.removeItem(index)}else CartManager.updateQuantity(index,newQuantity);loadCart()}function removeItem(index){if(confirm('Sei sicuro di voler rimuovere questo articolo?')){CartManager.removeItem(index);loadCart()}}function clearCart(){if(confirm('Sei sicuro di voler svuotare il carrello?')){CartManager.clearCart();loadCart()}}function goToCheckout(){if(!CartManager.getCart().length){alert('Il carrello è vuoto!');return}window.location.href='checkout.html'}loadCart();
</script>
</body>
</html>

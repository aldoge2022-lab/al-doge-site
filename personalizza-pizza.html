<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personalizza Pizza - AL DOGE</title>
<meta name="description" content="Personalizza la tua pizza AL DOGE: formato, impasto, aggiunte e carrello.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060504;--panel:#11100d;--panel-soft:#181511;--cream:#f3ead9;--muted:#b8ad9b;--line:rgba(185,156,98,.22);--line-strong:rgba(185,156,98,.42);--bronze:#b99c62;--bronze-light:#d2ba7c;--radius:22px;--radius-sm:14px}*{box-sizing:border-box;margin:0;padding:0}body{background:radial-gradient(circle at top right,rgba(185,156,98,.07),transparent 34%),linear-gradient(180deg,#050403,#080706);color:var(--cream);font-family:Inter,sans-serif;padding-bottom:94px}a{text-decoration:none;color:inherit}.topbar{position:sticky;top:0;z-index:50;background:rgba(8,7,6,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand video{width:46px;height:46px;object-fit:cover;border:1px solid rgba(185,156,98,.32);background:#0d0b08;border-radius:12px}.brand strong{display:block;font-family:'Playfair Display',serif;color:var(--bronze-light);font-size:22px}.brand span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions a{border:1px solid var(--line);padding:8px 11px;font-size:12px;font-weight:800;border-radius:999px}.top-actions .primary{background:var(--bronze);border-color:var(--bronze);color:#080706}.cart-link{position:relative}.cart-badge{position:absolute;top:-8px;right:-8px;background:#7f1d1d;color:#fff;border:2px solid #080706;min-width:22px;height:22px;border-radius:999px;display:none;align-items:center;justify-content:center;font-size:11px;font-weight:800}.wrap{max-width:920px;margin:0 auto;padding:24px 18px}.hero{text-align:left;margin-bottom:16px}.kicker{color:var(--bronze-light);font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;margin-bottom:8px}.hero h1{font-family:'Playfair Display',serif;color:var(--cream);font-size:clamp(32px,6vw,52px);line-height:1.03;margin-bottom:8px}.subtitle{color:var(--muted);line-height:1.5;font-size:14px;max-width:650px}.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(24,22,18,.9),rgba(12,10,8,.96));border-radius:var(--radius);padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.34)}.pizza-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:18px}.pizza-name{font-family:'Playfair Display',serif;font-size:32px;color:var(--bronze-light);line-height:1.05}.ingredients{color:var(--muted);font-size:14px;line-height:1.55;margin-top:8px}.base-price{font-size:20px;color:var(--cream);font-weight:900;white-space:nowrap;background:rgba(185,156,98,.12);border:1px solid rgba(185,156,98,.22);border-radius:999px;padding:8px 12px}.choice-block{margin-top:17px}.block-title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:9px}.block-title h2{font-size:15px;color:var(--cream);font-weight:900}.block-title span{font-size:12px;color:var(--muted)}.choice-row{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice-btn{border:1px solid rgba(185,156,98,.22);background:rgba(185,156,98,.06);color:var(--cream);border-radius:16px;padding:12px;text-align:left;cursor:pointer}.choice-btn strong{display:block;font-size:14px;margin-bottom:3px}.choice-btn span{display:block;color:var(--muted);font-size:12px}.choice-btn.active{background:rgba(185,156,98,.18);border-color:rgba(210,186,124,.65);box-shadow:0 0 0 3px rgba(185,156,98,.08)}.extra-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.extra-tab{border:1px solid rgba(185,156,98,.22);background:rgba(185,156,98,.06);color:var(--cream);border-radius:999px;padding:10px 9px;font-size:12px;font-weight:900;cursor:pointer}.extra-tab span{color:var(--muted);font-weight:700}.extra-tab.active{background:var(--bronze);border-color:var(--bronze);color:#080706}.extra-tab.active span{color:#17120b}.extra-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.extra-btn{border:1px solid rgba(185,156,98,.22);background:rgba(0,0,0,.16);color:var(--cream);border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.extra-btn:hover{border-color:rgba(185,156,98,.55)}.selected-box{margin-top:12px;border:1px solid rgba(185,156,98,.16);border-radius:16px;background:rgba(0,0,0,.12);padding:11px}.selected-box small{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.chips{display:flex;flex-wrap:wrap;gap:7px;min-height:26px}.chip{display:inline-flex;gap:7px;align-items:center;border:1px solid rgba(185,156,98,.34);background:rgba(185,156,98,.1);border-radius:999px;padding:7px 10px;font-size:12px}.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}.empty{color:var(--muted);font-size:13px;font-style:italic}.allergeni{margin-top:14px;color:rgba(200,190,170,.78);font-size:12px;border-left:2px solid rgba(185,156,98,.34);padding:8px 10px;background:rgba(255,255,255,.035)}.bar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(8,7,6,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 18px}.bar-inner{max-width:920px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}.quantity{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#0e0c09;border-radius:999px;padding:6px}.qty{width:32px;height:32px;border:0;border-radius:999px;background:var(--bronze);color:#080706;font-weight:900;font-size:18px;cursor:pointer}.qty-num{min-width:26px;text-align:center;font-weight:900}.total{text-align:right}.total span{display:block;color:var(--muted);font-size:12px}.total strong{display:block;color:var(--bronze-light);font-size:27px}.add{border:0;background:var(--bronze);color:#080706;border-radius:16px;min-height:50px;padding:13px 18px;font-weight:900;font-size:15px;cursor:pointer}.add:hover{filter:brightness(1.06);transform:translateY(-1px)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;background:#14110d;border:1px solid var(--line-strong);color:var(--cream);padding:12px 16px;border-radius:999px;box-shadow:0 22px 60px rgba(0,0,0,.45);font-size:13px;font-weight:800;z-index:80;transition:.22s ease}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.error{text-align:center;color:var(--muted);padding:42px 18px}.error a{color:var(--bronze-light);font-weight:800;border-bottom:1px solid rgba(185,156,98,.5)}@media(max-width:720px){.topbar{align-items:flex-start}.top-actions{justify-content:flex-end}.top-actions a{font-size:12px;padding:8px 10px}.wrap{padding:20px 16px}.pizza-head{display:block}.base-price{display:inline-block;margin-top:10px}.pizza-name{font-size:30px}.choice-row,.extra-tabs{grid-template-columns:1fr}.extra-list{grid-template-columns:1fr}.bar-inner{grid-template-columns:1fr;gap:10px}.total{text-align:left}.add{width:100%}.toast{bottom:158px}}
</style>
</head>
<body>
<div class="topbar"><a class="brand" href="index.html"><video autoplay loop muted playsinline poster="logo-al-doge.png"><source src="logo-animato.mp4" type="video/mp4"></video><div><strong>AL DOGE</strong><span>Personalizza</span></div></a><div class="top-actions"><a href="menu-semplice.html">← Menù</a><a href="tel:+3904321840683">Chiama</a><a class="cart-link" href="carrello.html">Carrello<span class="cart-badge" id="cart-badge">0</span></a><a class="primary" href="pizze.html">Tutte</a></div></div>
<div class="wrap">
<header class="hero"><div class="kicker">Completa la tua pizza</div><h1 id="page-title">Personalizza</h1><p class="subtitle">Scegli solo quello che ti serve. Puoi lasciare tutto normale e aggiungere subito al carrello.</p></header>
<div id="content"><div class="error">Caricamento pizza...</div></div>
</div>
<div class="toast" id="toast">Aggiunta al carrello</div>
<script src="pizza-pricing.js"></script>
<script>
let allPizzas=[];let pizza=null;let qty=1;let format='normale';let dough='normale';let openCategory='verdure';let selectedExtras=[];
const EXTRA_CATEGORIES=[{key:'verdure',label:'Verdure',priceLabel:'+€1,50',ingredients:['Funghi freschi','Funghi porcini','Carciofi','Peperoni','Cipolla','Patate al forno','Patatine','Rucola','Pomodorini','Zucchine','Spinaci','Radicchio di Treviso','Melanzane','Asparagi','Fagioli','Olive nere','Olive verdi','Olive taggiasche','Pomodori secchi','Capperi','Friarielli','Noci']},{key:'affettati',label:'Affettati',priceLabel:'+€2,00',ingredients:['Prosciutto cotto','Prosciutto crudo San Daniele','Bresaola','Speck','Pancetta','Salamino piccante','Wurstel','Salsiccia','Salame dolce','Petto d\'oca','Acciughe','Tonno','Salmone','Salmone affumicato','Gamberetti','Frutti di mare']},{key:'burrata-bufala',label:'Burrata / Bufala',priceLabel:'+€3,00',ingredients:['Burrata','Mozzarella di bufala']}];
function safe(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function euro(v){return '€'+Number(v||0).toFixed(2).replace('.',',')}function getCart(){try{return JSON.parse(localStorage.getItem('aldoge_cart')||'[]')}catch{return[]}}function saveCart(cart){localStorage.setItem('aldoge_cart',JSON.stringify(cart));updateCartBadge()}function updateCartBadge(){const total=getCart().reduce((s,i)=>s+(Number(i.quantity)||0),0);const b=document.getElementById('cart-badge');if(total>0){b.textContent=total;b.style.display='flex'}else b.style.display='none'}function showToast(t){const toast=document.getElementById('toast');toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
function currentPrice(){const formatS=(window.PizzaPricing?.FORMAT_SURCHARGES?.[format])||0;const doughS=(window.PizzaPricing?.DOUGH_SURCHARGES?.[dough])||0;const extraS=selectedExtras.reduce((s,e)=>s+((window.PizzaPricing?.EXTRA_SURCHARGES?.[e.categoryKey])||0),0);return Number(pizza?.price||0)+formatS+doughS+extraS}
function labels(){return window.PizzaPricing?.getVariantLabels?PizzaPricing.getVariantLabels({format,dough,extras:[]}):{format:format==='maxi'?'Maxi':'Normale',dough:dough==='normale'?'Normale':dough}}
function optionButton(type,value,title,desc,active){return `<button type="button" class="choice-btn ${active?'active':''}" onclick="${type}='${value}';render()"><strong>${title}</strong><span>${desc}</span></button>`}
function render(){if(!pizza){document.getElementById('content').innerHTML='<div class="error">Pizza non trovata. <a href="menu-semplice.html">Torna al menù</a></div>';return}document.getElementById('page-title').textContent=pizza.name;const activeCat=EXTRA_CATEGORIES.find(c=>c.key===openCategory)||EXTRA_CATEGORIES[0];document.getElementById('content').innerHTML=`<section class="panel"><div class="pizza-head"><div><div class="pizza-name">${safe(pizza.name)}</div><div class="ingredients">${(pizza.ingredients||[]).map(safe).join(', ')}</div></div><div class="base-price">da ${euro(pizza.price)}</div></div><div class="choice-block"><div class="block-title"><h2>Formato</h2><span>Scegli la misura</span></div><div class="choice-row">${optionButton('format','normale','Normale','Prezzo base',format==='normale')}${optionButton('format','maxi','Maxi','+€5,00',format==='maxi')}</div></div><div class="choice-block"><div class="block-title"><h2>Impasto</h2><span>Lascia normale o cambia</span></div><div class="choice-row">${optionButton('dough','normale','Normale','Impasto classico',dough==='normale')}${optionButton('dough','farina-di-riso','Farina di riso','+€1,50',dough==='farina-di-riso')}${optionButton('dough','kamut','Kamut','+€1,50',dough==='kamut')}</div></div><div class="choice-block"><div class="block-title"><h2>Aggiunte</h2><span>Opzionali</span></div><div class="extra-tabs">${EXTRA_CATEGORIES.map(cat=>`<button type="button" class="extra-tab ${openCategory===cat.key?'active':''}" onclick="openCategory='${cat.key}';render()">${cat.label}<br><span>${cat.priceLabel}</span></button>`).join('')}</div><div class="extra-list">${activeCat.ingredients.map((ing,i)=>`<button type="button" class="extra-btn" onclick="addExtra('${activeCat.key}',${i})">${safe(ing)}</button>`).join('')}</div><div class="selected-box"><small>Aggiunte selezionate</small><div class="chips">${selectedExtras.length?selectedExtras.map((e,i)=>`<span class="chip">${safe(e.name)} <button onclick="removeExtra(${i})">×</button></span>`).join(''):'<span class="empty">Nessuna aggiunta</span>'}</div></div></div>${(pizza.allergens||[]).length?`<div class="allergeni">Allergeni: ${(pizza.allergens||[]).map(safe).join(', ')}</div>`:''}</section><div class="bar"><div class="bar-inner"><div class="quantity"><button class="qty" onclick="qty=Math.max(1,qty-1);render()">−</button><div class="qty-num">${qty}</div><button class="qty" onclick="qty=Math.min(99,qty+1);render()">+</button></div><div class="total"><span>Totale</span><strong>${euro(currentPrice()*qty)}</strong></div><button class="add" onclick="addToCart()">Aggiungi al carrello</button></div></div>`;}
function addExtra(catKey,index){const cat=EXTRA_CATEGORIES.find(c=>c.key===catKey);if(!cat||!cat.ingredients[index])return;const name=cat.ingredients[index];if(!selectedExtras.some(e=>e.name===name))selectedExtras.push({categoryKey:catKey,name});render()}function removeExtra(i){selectedExtras=selectedExtras.filter((_,idx)=>idx!==i);render()}
function addToCart(){if(!pizza)return;const lab=labels();const extrasSignature=selectedExtras.map(e=>`${e.categoryKey}:${e.name}`).join('|')||'Nessuno';const signature=`${lab.format}::${lab.dough}::${extrasSignature}`;const cart=getCart();const existing=cart.findIndex(item=>item.type==='pizza'&&item.name===pizza.name&&(item.variantSignature||'')===signature);const finalPrice=currentPrice();if(existing!==-1)cart[existing].quantity+=qty;else cart.push({type:'pizza',name:pizza.name,basePrice:pizza.price,format:lab.format,dough:lab.dough,extras:selectedExtras.map(e=>e.name),variantSignature:signature,price:finalPrice,ingredients:pizza.ingredients||[],allergeni:pizza.allergens||[],quantity:qty});saveCart(cart);qty=1;showToast(`${pizza.name} aggiunta al carrello`);render()}
async function load(){try{const params=new URLSearchParams(location.search);const target=params.get('pizza')||sessionStorage.getItem('aldoge_focus_pizza')||'';const response=await fetch('/.netlify/functions/catalog');const data=await response.json();allPizzas=Array.isArray(data.pizzas)?data.pizzas:Array.isArray(data.items)?data.items:[];pizza=allPizzas.find(p=>p.name.toLowerCase()===target.toLowerCase())||allPizzas.find(p=>p.name.toLowerCase().includes(target.toLowerCase()));render();updateCartBadge()}catch(e){document.getElementById('content').innerHTML='<div class="error">Errore nel caricamento. <a href="menu-semplice.html">Torna al menù</a></div>'}}
load();updateCartBadge();
</script>
</body>
</html>

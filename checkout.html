<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - AL DOGE</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    :root {
      --gold: #d4af37;
      --dark: #0b0b0b;
      --soft: #1a1a1a;
      --text: #f5f5f5;
      --muted: #b3b3b3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding-bottom: 100px;
    }

    header {
      padding: 100px 20px 40px;
      text-align: center;
      background: linear-gradient(180deg, var(--soft) 0%, var(--dark) 100%);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: clamp(36px, 6vw, 56px);
      margin-bottom: 10px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .section {
      background: var(--soft);
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .section h2 {
      color: var(--gold);
      font-size: 24px;
      margin-bottom: 25px;
      font-family: 'Playfair Display', serif;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      color: var(--text);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: var(--dark);
      color: var(--text);
      font-size: 16px;
      font-family: 'Inter', sans-serif;
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .order-summary {
      background: var(--dark);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .summary-item:last-child {
      border-bottom: none;
      margin-top: 10px;
      padding-top: 15px;
      border-top: 2px solid var(--gold);
    }

    .summary-total {
      font-size: 24px;
      font-weight: 600;
      color: var(--gold);
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: var(--gold);
      color: black;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
    }

    .btn:hover {
      background: #b8962f;
    }

    .btn.secondary:hover {
      background: rgba(212, 175, 55, 0.1);
    }
  </style>
</head>

<body>

<header>
  <h1>Conferma Ordine</h1>
</header>

<div class="container">

  <div class="section">
    <h2>Dati Cliente</h2>

    <div class="form-group">
      <label class="form-label">Nome e Cognome</label>
      <input id="customer-name" class="form-input" placeholder="Mario Rossi">
    </div>

    <div class="form-group">
      <label class="form-label">Telefono</label>
      <input id="customer-phone" class="form-input" placeholder="333 1234567">
    </div>

    <div class="form-group">
      <label class="form-label">Modalità</label>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="delivery-type" value="consegna" checked>
          <span>Consegna a domicilio</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="delivery-type" value="ritiro">
          <span>Ritiro in pizzeria</span>
        </label>
      </div>
    </div>

    <div class="form-group" id="address-group">
      <label class="form-label">Indirizzo (solo per consegna)</label>
      <input id="customer-address" class="form-input" placeholder="Via Roma 10, Majano">
    </div>

    <div class="form-group">
      <label class="form-label">Giorno</label>
      <input id="order-date" type="date" class="form-input">
    </div>

    <div class="form-group">
      <label class="form-label">Orario</label>
      <select id="order-time" class="form-select"></select>
    </div>

    <div class="form-group">
      <label class="form-label">Note (opzionale)</label>
      <textarea id="customer-notes" class="form-textarea" placeholder="Campanello, allergie, richieste..."></textarea>
    </div>
  </div>

  <div class="section">
    <h2>Riepilogo Ordine</h2>
    <div id="order-summary" class="order-summary"></div>
  </div>

  <button id="pay-with-card" class="btn">Paga ora con carta</button>
  <button id="confirm-order" class="btn secondary">Conferma ordine e paga alla consegna</button>

</div>

<script src="cart-utils.js"></script>

<script>
  let stripeClient = null;
  let stripeClientKey = null;

  document.addEventListener("DOMContentLoaded", async () => {
    const summary = document.getElementById("order-summary");
    const cart = CartManager.getCart();
    const total = CartManager.getTotal();

    const params = new URLSearchParams(window.location.search);
    const paymentStatus = params.get("payment");

    if (paymentStatus === "success") {
      const pendingOrder = localStorage.getItem("al_doge_pending_order");

      if (pendingOrder) {
        try {
          const orderData = JSON.parse(pendingOrder);
          orderData.paymentStatus = "paid";
          orderData.paymentMethod = "stripe";

          await fetch("/.netlify/functions/telegram-notify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(orderData)
          });

          localStorage.removeItem("al_doge_pending_order");
          CartManager.clearCart();

          alert("Pagamento completato e ordine inviato correttamente.");

          window.history.replaceState({}, document.title, window.location.pathname);
        } catch (err) {
          console.error(err);
          alert("Pagamento ricevuto, ma errore invio notifica ordine.");
        }
      }
    }

    // Riepilogo ordine
    summary.innerHTML = cart
      .map(item => `
        <div class="summary-item">
          <span>${item.quantity}× ${item.name}</span>
          <span>€${(item.price * item.quantity).toFixed(2)}</span>
        </div>
      `)
      .join("") +
      `
        <div class="summary-item">
          <strong>Totale</strong>
          <strong class="summary-total">€${total.toFixed(2)}</strong>
        </div>
      `;

    const deliveryRadios = document.querySelectorAll('input[name="delivery-type"]');
    const addressGroup = document.getElementById("address-group");

    deliveryRadios.forEach(r => {
      r.addEventListener("change", () => {
        const mode = document.querySelector('input[name="delivery-type"]:checked').value;
        if (mode === "ritiro") {
          addressGroup.style.display = "none";
        } else {
          addressGroup.style.display = "block";
        }
      });
    });

    const dateInput = document.getElementById("order-date");
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    dateInput.min = `${yyyy}-${mm}-${dd}`;
    dateInput.value = `${yyyy}-${mm}-${dd}`;

    const timeSelect = document.getElementById("order-time");
    function populateTimes() {
      timeSelect.innerHTML = "";
      const startHour = 18;
      const endHour = 22;
      for (let h = startHour; h <= endHour; h++) {
        for (let m of [0, 15, 30, 45]) {
          const label = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
          const option = document.createElement("option");
          option.value = label;
          option.textContent = label;
          timeSelect.appendChild(option);
        }
      }
    }
    populateTimes();

    const confirmBtn = document.getElementById("confirm-order");
    const payWithCardBtn = document.getElementById("pay-with-card");

    function collectOrderData() {
      const name = document.getElementById("customer-name").value.trim();
      const phone = document.getElementById("customer-phone").value.trim();
      const mode = document.querySelector('input[name="delivery-type"]:checked').value;
      const address = document.getElementById("customer-address").value.trim();
      const date = document.getElementById("order-date").value;
      const time = document.getElementById("order-time").value;
      const notes = document.getElementById("customer-notes").value.trim();

      if (!name || !phone) {
        alert("Compila nome e telefono.");
        return null;
      }

      if (mode === "consegna" && !address) {
        alert("Inserisci l'indirizzo per la consegna.");
        return null;
      }

      if (!date || !time) {
        alert("Seleziona giorno e orario.");
        return null;
      }

      if (!cart.length) {
        alert("Il carrello è vuoto.");
        return null;
      }

      const orderType = mode === "ritiro" ? "ritiro_in_pizzeria" : "asporto";

      return {
        name,
        phone,
        mode,
        orderType,
        address: mode === "consegna" ? address : "",
        date,
        time,
        pickupTime: time,
        notes,
        items: cart.map(i => ({
          name: i.name,
          qty: i.quantity,
          price: i.price,
          extras: Array.isArray(i.extras) ? i.extras : []
        })),
        total: total.toFixed(2)
      };
    }

    async function sendToTelegram(orderData) {
      const response = await fetch("/.netlify/functions/telegram-notify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(orderData)
      });
      if (!response.ok) {
        throw new Error("Errore Telegram");
      }
    }

    confirmBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      const orderData = collectOrderData();
      if (!orderData) return;

      confirmBtn.disabled = true;
      confirmBtn.textContent = "Invio...";

      try {
        await sendToTelegram(orderData);
        alert("Ordine inviato con successo!");
        CartManager.clearCart();
        window.location.href = "index.html";
      } catch (err) {
        alert("Errore nell'invio dell'ordine.");
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.textContent = "Conferma ordine e paga alla consegna";
      }
    });

    payWithCardBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      const orderData = collectOrderData();
      if (!orderData) return;

      localStorage.setItem("al_doge_pending_order", JSON.stringify(orderData));

      payWithCardBtn.disabled = true;
      payWithCardBtn.textContent = "Reindirizzamento a Stripe...";

      try {
        const response = await fetch("/.netlify/functions/stripe-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(orderData)
        });

        if (!response.ok) {
          throw new Error("Errore creazione sessione Stripe");
        }

        const { sessionId, publishableKey } = await response.json();

        if (!sessionId) {
          throw new Error("sessionId Stripe mancante");
        }

        if (!publishableKey) {
          throw new Error("publishableKey Stripe mancante");
        }

        if (!stripeClient || stripeClientKey !== publishableKey) {
          stripeClient = Stripe(publishableKey);
          stripeClientKey = publishableKey;
        }

        const { error } = await stripeClient.redirectToCheckout({ sessionId });

        if (error) {
          alert("Errore nel reindirizzamento al pagamento.");
        }
      } catch (err) {
        alert("Errore nella creazione del pagamento.");
      } finally {
        payWithCardBtn.disabled = false;
        payWithCardBtn.textContent = "Paga ora con carta";
      }
    });
  });
</script>

</body>
</html>

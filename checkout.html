<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - AL DOGE</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    :root {
      --gold: #d4af37;
      --dark: #0b0b0b;
      --soft: #1a1a1a;
      --text: #f5f5f5;
      --muted: #b3b3b3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding-bottom: 100px;
    }

    header {
      padding: 100px 20px 40px;
      text-align: center;
      background: linear-gradient(180deg, var(--soft) 0%, var(--dark) 100%);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: clamp(36px, 6vw, 56px);
      margin-bottom: 10px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .section {
      background: var(--soft);
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .section h2 {
      color: var(--gold);
      font-size: 24px;
      margin-bottom: 25px;
      font-family: 'Playfair Display', serif;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      color: var(--text);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: var(--dark);
      color: var(--text);
      font-size: 16px;
      font-family: 'Inter', sans-serif;
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .order-summary {
      background: var(--dark);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .summary-item:last-child {
      border-bottom: none;
      margin-top: 10px;
      padding-top: 15px;
      border-top: 2px solid var(--gold);
    }

    .summary-total {
      font-size: 24px;
      font-weight: 600;
      color: var(--gold);
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: var(--gold);
      color: black;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn:hover {
      background: #b8962f;
    }
  </style>
</head>

<body>

<header>
  <h1>Conferma Ordine</h1>
</header>

<div class="container">

  <div class="section">
    <h2>Dati Cliente</h2>

    <div class="form-group">
      <label class="form-label">Nome e Cognome</label>
      <input id="customer-name" class="form-input" placeholder="Mario Rossi">
    </div>

    <div class="form-group">
      <label class="form-label">Telefono</label>
      <input id="customer-phone" class="form-input" placeholder="333 1234567">
    </div>

    <div class="form-group">
      <label class="form-label">Indirizzo</label>
      <input id="customer-address" class="form-input" placeholder="Via Roma 10, Majano">
    </div>

    <div class="form-group">
      <label class="form-label">Note (opzionale)</label>
      <textarea id="customer-notes" class="form-textarea" placeholder="Campanello, allergie, richieste..."></textarea>
    </div>
  </div>

  <div class="section">
    <h2>Riepilogo Ordine</h2>
    <div id="order-summary" class="order-summary"></div>
  </div>

  <button id="confirm-order" class="btn">Conferma Ordine</button>

</div>

<script src="cart-utils.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const summary = document.getElementById("order-summary");
  const cart = CartManager.getCart();
  const total = CartManager.getTotal();

  summary.innerHTML = cart
    .map(item => `
      <div class="summary-item">
        <span>${item.quantity}× ${item.name}</span>
        <span>€${(item.price * item.quantity).toFixed(2)}</span>
      </div>
    `)
    .join("") +
    `
      <div class="summary-item">
        <strong>Totale</strong>
        <strong class="summary-total">€${total.toFixed(2)}</strong>
      </div>
    `;

  const confirmBtn = document.getElementById("confirm-order");

  async function sendOrder() {
    const name = document.getElementById("customer-name").value.trim();
    const phone = document.getElementById("customer-phone").value.trim();
    const address = document.getElementById("customer-address").value.trim();
    const notes = document.getElementById("customer-notes").value.trim();

    if (!name || !phone || !address) {
      alert("Compila nome, telefono e indirizzo.");
      return;
    }

    const orderData = {
      name,
      phone,
      address,
      notes,
      items: cart.map(i => ({
        name: i.name,
        qty: i.quantity,
        price: i.price
      })),
      total: total.toFixed(2)
    };

    confirmBtn.disabled = true;
    confirmBtn.textContent = "Invio...";

    try {
      const response = await fetch("/.netlify/functions/telegram-notify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(orderData)
      });

      if (!response.ok) {
        alert("Errore nell'invio dell'ordine.");
        return;
      }

      alert("Ordine inviato con successo!");
      CartManager.clearCart();
      window.location.href = "home.html";

    } catch (err) {
      alert("Errore di connessione.");
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.textContent = "Conferma Ordine";
    }
  }

  confirmBtn.addEventListener("click", (e) => {
    e.preventDefault();
    sendOrder();
  });
});
</script>

</body>
</html>

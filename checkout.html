<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout – AL DOGE</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Checkout</h1>
    <a href="index.html">← Torna al menu</a>
</header>

<main>

    <section>
        <h2>Riepilogo ordine</h2>
        <div id="riepilogo"></div>
        <p id="totale" class="totale"></p>
        <p id="checkout-status" class="status-message" role="status" aria-live="polite"></p>
    </section>

    <section>
        <h2>Dati cliente</h2>

        <form id="form-checkout">
            <label>Nome e Cognome</label>
            <input type="text" id="nome" required>

            <label>Telefono</label>
            <input type="text" id="telefono" required>

            <label>Note (opzionale)</label>
            <textarea id="note"></textarea>

            <button type="submit" id="checkout-button">Paga con Stripe</button>
        </form>
    </section>

</main>

<footer>
    <p>© 2026 AL DOGE – Majano</p>
</footer>

<script src="https://js.stripe.com/v3/"></script>
<script src="cart-utils.js"></script>

<script>
// ===============================
//  MOSTRA RIEPILOGO CARRELLO
// ===============================

const statusMessage = document.getElementById("checkout-status");
const checkoutButton = document.getElementById("checkout-button");
let stripeClient = null;

function setStatus(message, isError = false) {
    statusMessage.textContent = message;
    statusMessage.classList.toggle("error", isError);
}

function getCartItems() {
    const cart = CartManager.getCart();
    if (cart.length > 0) {
        return cart.map(normalizeCartItem);
    }

    const legacyCart = JSON.parse(localStorage.getItem("carrello") || "[]");
    return legacyCart.map(normalizeCartItem);
}

function normalizeCartItem(item) {
    return {
        name: item.name || item.nome,
        price: item.price || item.prezzo,
        quantity: item.quantity || item.quantita,
        ingredients: item.ingredients || item.ingredienti || []
    };
}

function calcolaTotale(items) {
    return items.reduce((sum, item) => {
        const quantity = Number(item.quantity || 0);
        const price = Number(item.price || 0);
        return sum + (price * quantity);
    }, 0);
}

function mostraRiepilogo() {
    const carrello = getCartItems();
    const div = document.getElementById("riepilogo");

    if (carrello.length === 0) {
        div.innerHTML = "<p>Il carrello è vuoto.</p>";
        checkoutButton.disabled = true;
        return;
    }

    carrello.forEach(item => {
        const riga = document.createElement("div");
        riga.className = "riga-riepilogo";

        const ingredienti = item.ingredients.length > 0
            ? ` - ${item.ingredients.join(", ")}`
            : "";
        const quantity = item.quantity || 1;
        const price = item.price || 0;

        riga.innerHTML = `
            <span>${item.name} (x${quantity})${ingredienti}</span>
            <span>€ ${(price * quantity).toFixed(2)}</span>
        `;

        div.appendChild(riga);
    });

    document.getElementById("totale").textContent =
        "Totale: € " + calcolaTotale(carrello).toFixed(2);
}

async function loadStripeClient() {
    if (stripeClient) {
        return stripeClient;
    }

    const response = await fetch("/.netlify/functions/stripe-config");
    const data = await response.json();

    if (!response.ok || !data.publicKey) {
        throw new Error(data.error || "Stripe non configurato");
    }

    stripeClient = Stripe(data.publicKey);
    return stripeClient;
}

function handleCheckoutReturn() {
    const params = new URLSearchParams(window.location.search);
    if (params.get("success")) {
        setStatus("Pagamento completato! Riceverai conferma a breve.");
        CartManager.clearCart();
        document.getElementById("form-checkout").style.display = "none";
        mostraRiepilogo();
    }

    if (params.get("canceled")) {
        setStatus("Pagamento annullato. Puoi riprovare quando vuoi.", true);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    mostraRiepilogo();
    handleCheckoutReturn();
});


// ===============================
//  INVIO ORDINE A NETLIFY
// ===============================

document.getElementById("form-checkout").addEventListener("submit", async (e) => {
    e.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const note = document.getElementById("note").value.trim();
    const carrello = getCartItems();

    if (!nome || !telefono || carrello.length === 0) {
        setStatus("Compila tutti i campi e assicurati che il carrello non sia vuoto.", true);
        return;
    }

    checkoutButton.disabled = true;
    checkoutButton.textContent = "⏳ Reindirizzamento...";
    setStatus("");

    try {
        const stripe = await loadStripeClient();

        const risposta = await fetch("/.netlify/functions/create-checkout-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                type: "order",
                customer: { name: nome, phone: telefono, notes: note },
                items: carrello
            })
        });

        const risultato = await risposta.json();

        if (!risposta.ok || !risultato.sessionId) {
            throw new Error(risultato.error || "Errore nella creazione del pagamento.");
        }

        const { error } = await stripe.redirectToCheckout({ sessionId: risultato.sessionId });
        if (error) {
            throw new Error(error.message);
        }
    } catch (error) {
        console.error("Errore checkout:", error);
        setStatus(error.message || "Errore nel processare il pagamento. Riprova.", true);
        checkoutButton.disabled = false;
        checkoutButton.textContent = "Paga con Stripe";
    }
});
</script>

</body>
</html>

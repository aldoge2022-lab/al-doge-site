<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordine ricevuto - AL DOGE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#d4af37; --dark:#0b0b0b; --soft:#1a1a1a; --text:#f5f5f5; --muted:#b3b3b3; --success:#4CAF50; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:radial-gradient(circle at top, #1e1a10 0%, var(--dark) 46%, #050505 100%); color:var(--text); font-family:'Inter', sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:680px; background:linear-gradient(180deg, rgba(26,26,26,.96), rgba(12,12,12,.96)); border:1px solid rgba(212,175,55,.28); border-radius:24px; padding:46px 30px; text-align:center; box-shadow:0 24px 80px rgba(0,0,0,.45); }
    .mark { width:84px; height:84px; border-radius:50%; border:2px solid rgba(76,175,80,.8); color:var(--success); display:inline-flex; align-items:center; justify-content:center; font-size:46px; margin-bottom:24px; }
    h1 { font-family:'Playfair Display', serif; color:var(--gold); font-size:clamp(38px, 7vw, 62px); margin-bottom:14px; }
    p { color:var(--muted); line-height:1.65; font-size:17px; max-width:560px; margin:0 auto 12px; }
    .box { margin:28px auto; padding:18px; max-width:520px; border-radius:16px; border:1px solid rgba(212,175,55,.22); background:rgba(212,175,55,.07); text-align:left; color:var(--text); line-height:1.7; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:520px; margin:30px auto 0; }
    a { display:block; padding:15px 18px; border-radius:12px; text-decoration:none; font-weight:700; }
    .primary { background:var(--gold); color:#000; }
    .secondary { color:var(--gold); border:1px solid var(--gold); }
    @media (max-width:620px){ .actions{grid-template-columns:1fr;} .card{padding:38px 22px;} }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✓</div>
    <h1>Ordine ricevuto</h1>
    <p>Grazie. Il tuo ordine è stato inviato correttamente allo staff AL DOGE.</p>
    <p>Per modifiche urgenti o richieste particolari, contattaci telefonicamente.</p>
    <div class="box" id="order-detail">
      <strong>Stato:</strong> ordine confermato<br>
      <strong>Prossimo passo:</strong> lo staff prenderà in carico la richiesta.
    </div>
    <div class="actions">
      <a class="secondary" href="index.html">Torna alla home</a>
      <a class="primary" href="pizze.html">Ordina ancora</a>
    </div>
  </main>
</body>
</html>

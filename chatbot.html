<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guida AL DOGE V3</title>

  <style>
    body {
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: radial-gradient(circle at top, #243347 0%, #101722 58%, #0b1119 100%);
      color: #f5efe3;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: linear-gradient(120deg, rgba(29,39,53,0.95), rgba(52,41,32,0.88));
      color: #fff4de;
      border-bottom: 1px solid rgba(201, 164, 90, 0.4);
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      list-style: none;
      margin: 0;
    }

    .message {
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 16px;
    }

    .user {
      align-self: flex-end;
      background: #d6b06a;
      color: #1f1a12;
    }

    .bot {
      align-self: flex-start;
      background: linear-gradient(140deg, rgba(45,56,71,0.92), rgba(51,41,32,0.9));
      border: 1px solid rgba(201, 164, 90, 0.38);
      color: #f5efe3;
    }

    #input-area {
      display: flex;
      padding: 10px;
      background: rgba(248, 242, 230, 0.96);
      border-top: 1px solid rgba(201, 164, 90, 0.35);
    }

    #user-input {
      flex: 1;
      padding: 12px;
      border: 1px solid rgba(29, 39, 53, 0.25);
      border-radius: 8px;
      font-size: 16px;
    }

    #send-btn {
      margin-left: 10px;
      padding: 12px 18px;
      background: linear-gradient(120deg, #d6b06a, #c39a4d);
      color: #1b1710;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #send-btn:hover {
      background: #d0a75d;
    }
  </style>
</head>

<body>
  <header>AL DOGE V3 · Ti aiutiamo a scegliere con gusto</header>

  <ul id="chat"></ul>

  <div id="input-area">
    <input
      type="text"
      id="user-input"
      placeholder="Dimmi come lo vuoi: caldo, croccante, leggero, deciso..."
    />
    <button id="send-btn">Invia</button>
  </div>

  <script>
    const chatContainer = document.getElementById("chat");

    addMessage("Benvenuto da AL DOGE. Ti accompagno nella scelta del panino giusto: ingredienti veri, equilibrio e gusto.", "bot");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const AI_ENGINE_ENDPOINT = "/.netlify/functions/ai-orchestrator";

    function addMessage(text, sender) {
      const msg = document.createElement("li");
      msg.classList.add("message", sender);
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      addMessage("Sto pensando...", "bot");

      try {
        const response = await fetch(AI_ENGINE_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });

        const data = await response.json();

        chatContainer.removeChild(chatContainer.lastChild);

        addMessage(data.reply || "Non riesco a rispondere in questo momento.", "bot");
      } catch (e) {
        chatContainer.removeChild(chatContainer.lastChild);
        addMessage("Si è verificato un errore, riprova tra poco.", "bot");
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>

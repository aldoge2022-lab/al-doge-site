<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulente Ordini AL DOGE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0f1b2d;
      --anthracite: #1f232c;
      --gold: #c9a34d;
      --white: #f7f7f5;
      --muted: #c9ccd3;
      --line: rgba(201, 163, 77, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #18253b 0%, #101821 45%, #0b121a 100%);
      color: var(--white);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .chat-shell {
      width: min(940px, 100%);
      height: min(900px, calc(100vh - 40px));
      background: linear-gradient(160deg, rgba(31, 35, 44, 0.97), rgba(15, 27, 45, 0.95));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 26px 28px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 13, 20, 0.25);
    }

    .title {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 4vw, 36px);
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      font-size: 15px;
      color: var(--muted);
      line-height: 1.45;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      list-style: none;
      margin: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.08), transparent 30%);
    }

    .message {
      max-width: 86%;
      padding: 14px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #d6b46a, var(--gold));
      color: #1b1b1b;
      font-weight: 500;
    }

    .bot {
      align-self: flex-start;
      background: #242b37;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--white);
    }

    #input-area {
      display: flex;
      gap: 12px;
      padding: 18px 24px 22px;
      background: rgba(6, 10, 15, 0.35);
      border-top: 1px solid var(--line);
    }

    #user-input {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: #1a2230;
      color: var(--white);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #user-input::placeholder {
      color: #a8afbb;
    }

    #user-input:focus {
      border-color: rgba(201, 163, 77, 0.8);
      box-shadow: 0 0 0 3px rgba(201, 163, 77, 0.2);
    }

    #send-btn {
      padding: 14px 22px;
      background: linear-gradient(130deg, #d6b46a, var(--gold));
      color: #111;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }

    #send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(201, 163, 77, 0.35);
    }

    #send-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    @media (max-width: 680px) {
      body {
        padding: 10px;
      }

      .chat-shell {
        height: calc(100vh - 20px);
        border-radius: 16px;
      }

      header {
        padding: 20px 18px 14px;
      }

      #chat {
        padding: 18px 16px 10px;
      }

      #input-area {
        padding: 14px 16px 16px;
      }

      #send-btn {
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>
  <div class="chat-shell">
    <header>
      <h1 class="title">Consulente Ordini AL DOGE</h1>
      <p class="subtitle">Indicaci i tuoi gusti: ti guidiamo verso la scelta migliore con proposte chiare e affidabili.</p>
    </header>

    <ul id="chat"></ul>

    <div id="input-area">
      <input
        type="text"
        id="user-input"
        placeholder="Descrivi cosa desideri ordinare"
      />
      <button id="send-btn">Continua</button>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById("chat");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const AI_ENGINE_ENDPOINT = "/.netlify/functions/ai-orchestrator";

    addMessage("Benvenuto in AL DOGE. Dimmi cosa desideri e ti propongo una selezione su misura.", "bot");

    function addMessage(text, sender) {
      const msg = document.createElement("li");
      msg.classList.add("message", sender);
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      addMessage("Sto pensando...", "bot");

      try {
        const response = await fetch(AI_ENGINE_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });

        const data = await response.json();

        chatContainer.removeChild(chatContainer.lastChild);

        addMessage(data.reply || "Non riesco a rispondere in questo momento.", "bot");
      } catch (e) {
        chatContainer.removeChild(chatContainer.lastChild);
        addMessage("Si è verificato un errore, riprova tra poco.", "bot");
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>

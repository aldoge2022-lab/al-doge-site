<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ordina con l'assistente AL DOGE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night-950: #090d16;
      --night-900: #0f1727;
      --night-850: #151f33;
      --night-800: #1b2940;
      --gold-400: #d4af37;
      --gold-300: #e7c66a;
      --text-100: #f3f4f8;
      --text-300: #c3c7d6;
      --line: rgba(232, 214, 162, 0.2);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--text-100);
      background:
        radial-gradient(circle at 90% -15%, rgba(212, 175, 55, 0.13), transparent 35%),
        radial-gradient(circle at 10% 10%, rgba(79, 104, 162, 0.2), transparent 40%),
        linear-gradient(180deg, #070b13 0%, #090d16 35%, #0f1727 100%);
    }

    .page-shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 16px 34px;
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(15, 23, 39, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 12px 10px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 26px;
    }

    .brand-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy strong {
      display: block;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--gold-300);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-copy span {
      display: block;
      color: var(--text-300);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-action {
      position: relative;
      background: linear-gradient(145deg, #d7b74a 0%, #b78f2f 100%);
      color: #1a1202;
      border: none;
      border-radius: 999px;
      height: 40px;
      padding: 0 15px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(182, 141, 40, 0.42);
    }

    #cart-badge {
      position: absolute;
      top: -6px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: white;
      background: #b61b1b;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .hero {
      margin-bottom: 20px;
      padding: 6px 2px;
    }

    .hero-kicker {
      color: var(--gold-300);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-size: 11px;
      margin: 0 0 8px;
    }

    .hero h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 5.2vw, 52px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: 0.01em;
      max-width: 10ch;
    }

    .hero p {
      margin: 14px 0 0;
      color: var(--text-300);
      max-width: 48ch;
      line-height: 1.55;
      font-size: 15px;
    }

    .assistant-card {
      background: linear-gradient(180deg, rgba(23, 34, 53, 0.92) 0%, rgba(17, 26, 42, 0.96) 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .assistant-body {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .composer {
      background: rgba(8, 13, 24, 0.62);
      border: 1px solid rgba(232, 214, 162, 0.18);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .composer label {
      display: block;
      color: var(--text-300);
      font-size: 13px;
      margin-bottom: 10px;
    }

    #user-input {
      width: 100%;
      resize: none;
      border: 1px solid rgba(220, 206, 170, 0.22);
      background: linear-gradient(180deg, rgba(10, 16, 28, 0.84), rgba(8, 12, 22, 0.96));
      border-radius: 12px;
      padding: 12px 14px;
      min-height: 92px;
      color: var(--text-100);
      font: inherit;
      line-height: 1.45;
    }

    #user-input::placeholder {
      color: #8f97ac;
    }

    #user-input:focus {
      outline: none;
      border-color: rgba(217, 183, 82, 0.75);
      box-shadow: 0 0 0 3px rgba(211, 169, 56, 0.16);
    }

    .composer-footer {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }

    #send-btn {
      border: 1px solid rgba(246, 224, 161, 0.5);
      background: linear-gradient(145deg, #dbba58 0%, #b68c2a 100%);
      color: #171104;
      font-weight: 600;
      letter-spacing: 0.01em;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 20px rgba(180, 138, 34, 0.35);
    }

    #send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(180, 138, 34, 0.4);
    }

    #send-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      border: 1px solid rgba(224, 199, 132, 0.3);
      border-radius: 999px;
      background: rgba(22, 33, 52, 0.8);
      color: #d7dcee;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    .chip:hover {
      border-color: rgba(224, 199, 132, 0.72);
      color: #fff;
      background: rgba(32, 46, 71, 0.9);
    }

    .responses {
      border-top: 1px solid rgba(235, 218, 169, 0.15);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 390px;
      overflow-y: auto;
    }

    .message {
      list-style: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.5;
      border: 1px solid transparent;
      max-width: 92%;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(180deg, rgba(39, 58, 91, 0.95), rgba(28, 43, 68, 0.95));
      border-color: rgba(156, 187, 242, 0.34);
    }

    .message.bot {
      align-self: flex-start;
      background: linear-gradient(180deg, rgba(17, 25, 40, 0.95), rgba(13, 20, 32, 0.95));
      border-color: rgba(224, 199, 132, 0.22);
      color: #f0f2f8;
    }

    @media (min-width: 820px) {
      .assistant-body {
        padding: 24px;
      }

      .hero p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand-link" href="home.html" aria-label="Vai alla home AL DOGE">
        <img src="logo-al-doge.png" class="brand-logo" alt="Logo AL DOGE" />
        <div class="brand-copy">
          <strong>AL DOGE</strong>
          <span>Assistente ordini</span>
        </div>
      </a>
      <button class="cart-action" type="button" onclick="window.location.href='carrello.html'">
        Carrello
        <span id="cart-badge">0</span>
      </button>
    </header>

    <section class="hero">
      <p class="hero-kicker">Esperienza guidata</p>
      <h1>Ordina con l'assistente AL DOGE</h1>
      <p>Dimmi cosa hai voglia di mangiare. Ti aiutiamo a trovare la scelta giusta tra pizza, panino o proposta completa.</p>
    </section>

    <main class="assistant-card">
      <div class="assistant-body">
        <section class="composer">
          <label for="user-input">Dimmi cosa desideri</label>
          <textarea id="user-input" placeholder="Es. Vorrei una pizza saporita ma non troppo pesante, con una bevanda in abbinamento."></textarea>
          <div class="composer-footer">
            <button id="send-btn" type="button">Invia richiesta</button>
          </div>
        </section>

        <section class="chips" aria-label="Suggerimenti rapidi">
          <button class="chip" type="button" data-prompt="Mi consigli una pizza leggera e gustosa?">Pizza leggera e gustosa</button>
          <button class="chip" type="button" data-prompt="Vorrei un panino saporito con ingredienti freschi.">Panino saporito e fresco</button>
          <button class="chip" type="button" data-prompt="Siamo in due: ci suggerisci una proposta completa con bevande?">Proposta completa per due</button>
          <button class="chip" type="button" data-prompt="Cerco una scelta vegetariana con bevanda abbinata.">Opzione vegetariana</button>
        </section>

        <ul class="responses" id="chat" aria-live="polite"></ul>
      </div>
    </main>
  </div>

  <script src="cart-utils.js"></script>
  <script>
    const chatContainer = document.getElementById("chat");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const chips = document.querySelectorAll(".chip");
    const AI_ENGINE_ENDPOINT = "/.netlify/functions/ai-orchestrator";

    function addMessage(text, sender) {
      const msg = document.createElement("li");
      msg.classList.add("message", sender);
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;

      addMessage(text, "user");
      input.value = "";

      sendBtn.disabled = true;
      const loadingMessage = addMessage("Un momento, preparo il consiglio migliore per te…", "bot");

      try {
        const response = await fetch(AI_ENGINE_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });

        const data = await response.json();
        loadingMessage.remove();
        addMessage(data.reply || "Al momento non riesco a rispondere, riprova tra poco.", "bot");
      } catch (error) {
        loadingMessage.remove();
        addMessage("Si è verificato un errore temporaneo. Riprova tra poco.", "bot");
      } finally {
        sendBtn.disabled = false;
      }
    }

    chips.forEach((chip) => {
      chip.addEventListener("click", () => {
        input.value = chip.dataset.prompt || "";
        input.focus();
      });
    });

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    addMessage("Benvenuto da AL DOGE. Dimmi cosa desideri e ti guiderò nella scelta.", "bot");
    CartManager.updateBadge();
  </script>
</body>
</html>

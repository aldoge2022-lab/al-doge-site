<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL DOGE – Ordina Online | Farla di Majano</title>

<meta name="description" content="Ordina online da AL DOGE. Menu pizze, carrello integrato e pagamento veloce e sicuro.">
<meta name="keywords" content="pizzeria Majano, ordina pizza online, AL DOGE">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
--gold:#d4af37;
--dark:#0b0b0b;
--soft:#1a1a1a;
--text:#f5f5f5;
}

body{
margin:0;
background:var(--dark);
color:var(--text);
font-family:'Inter',sans-serif;
}

h1{
font-family:'Playfair Display',serif;
color:var(--gold);
font-size:64px;
margin:0;
}

.hero{
position:relative;
height:100vh;
background:url('hero-image.jpg') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.overlay{
background:rgba(0,0,0,0.65);
position:absolute;
inset:0;
}

.hero-content{
position:relative;
z-index:2;
}

.subtitle{
margin-top:15px;
font-size:18px;
opacity:0.9;
}

.btn{
display:inline-block;
margin:15px 10px 0 10px;
padding:14px 30px;
border-radius:30px;
font-weight:500;
text-decoration:none;
}

.btn-gold{
background:var(--gold);
color:black;
}

.btn-white{
background:white;
color:black;
}

.logo-fixed{
position:fixed;
top:20px;
left:20px;
z-index:999;
width:70px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.cart-badge{
position:fixed;
top:20px;
right:20px;
background:var(--gold);
color:black;
padding:10px 15px;
border-radius:30px;
font-weight:600;
text-decoration:none;
}

footer{
position:absolute;
bottom:20px;
width:100%;
text-align:center;
font-size:13px;
opacity:0.6;
}
</style>
</head>

<body>

<video class="logo-fixed" autoplay loop muted playsinline>
<source src="logo-animato.mp4" type="video/mp4">
</video>

<a href="carrello.html" class="cart-badge">
Carrello <span id="cart-count">0</span>
</a>

<div class="hero">
<div class="overlay"></div>

<div class="hero-content">
<h1>AL DOGE</h1>
<div class="subtitle">
Ordina online. Ritira senza attese.
</div>

<a href="pizze.html" class="btn btn-gold">
🍕 Ordina Pizze
</a>

<a href="carrello.html" class="btn btn-white">
🛒 Vai al Carrello
</a>

</div>
</div>

<footer>
© 2026 AL DOGE – Via S. Daniele 3, Farla di Majano
</footer>

<script src="cart-utils.js"></script>
<script>
updateCartBadge();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL DOGE – Ordina Online | Farla di Majano</title>

<meta name="description" content="Ordina online da AL DOGE. Pizze, pagamento veloce e sicuro.">
<meta name="keywords" content="pizzeria Majano, ordina pizza online, AL DOGE">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
--gold:#d4af37;
--dark:#0b0b0b;
--soft:#1a1a1a;
--text:#f5f5f5;
}

body{
margin:0;
background:var(--dark);
color:var(--text);
font-family:'Inter',sans-serif;
}

h1{
font-family:'Playfair Display',serif;
color:var(--gold);
font-size:64px;
margin:0;
}

.hero{
position:relative;
height:100vh;
background:url('hero-image.jpg') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.overlay{
background:rgba(0,0,0,0.65);
position:absolute;
inset:0;
}

.hero-content{
position:relative;
z-index:2;
}

.subtitle{
margin-top:15px;
font-size:18px;
opacity:0.9;
}

.btn{
display:inline-block;
margin:15px 10px 0 10px;
padding:14px 30px;
border-radius:30px;
font-weight:500;
text-decoration:none;
}

.btn-gold{
background:var(--gold);
color:black;
}

.btn-white{
background:white;
color:black;
}

.panini-spotlight{
margin:28px auto 0;
max-width:640px;
background:linear-gradient(140deg,rgba(10,18,33,.95),rgba(27,27,27,.92));
border:1px solid rgba(212,175,55,.5);
border-radius:20px;
padding:20px 22px;
box-shadow:0 16px 36px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06) inset;
text-align:left;
display:flex;
align-items:center;
justify-content:space-between;
gap:16px;
transition:transform .3s ease,box-shadow .3s ease;
}

.panini-spotlight:hover{
transform:translateY(-3px);
box-shadow:0 22px 44px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08) inset;
}

.panini-copy h2{
font-family:'Playfair Display',serif;
font-size:clamp(22px,3vw,32px);
color:#fff;
margin:0 0 8px 0;
}

.panini-copy p{
margin:0;
color:#ececec;
font-size:15px;
line-height:1.45;
}

.panini-cta{
background:var(--gold);
color:#111;
text-decoration:none;
border-radius:999px;
padding:12px 20px;
font-weight:600;
white-space:nowrap;
box-shadow:0 6px 18px rgba(212,175,55,.35);
transition:transform .25s ease,box-shadow .25s ease,background-color .25s ease;
}

.panini-cta:hover{
transform:translateY(-2px);
box-shadow:0 10px 22px rgba(212,175,55,.45);
background:#e6c157;
}

.panini-cta:focus-visible{
outline:2px solid #fff;
outline-offset:4px;
}

.logo-fixed{
position:fixed;
top:20px;
left:20px;
z-index:999;
width:70px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.cart-badge{
position:fixed;
top:20px;
right:20px;
background:var(--gold);
color:black;
padding:10px 15px;
border-radius:30px;
font-weight:600;
text-decoration:none;
}

footer{
position:absolute;
bottom:20px;
width:100%;
text-align:center;
font-size:13px;
opacity:0.6;
}

@media (max-width:768px){
.panini-spotlight{
flex-direction:column;
align-items:flex-start;
padding:18px;
}

.panini-cta{
width:100%;
text-align:center;
}
}
</style>
</head>

<body>

<video class="logo-fixed" autoplay loop muted playsinline>
<source src="logo-animato.mp4" type="video/mp4">
</video>

<a href="carrello.html" class="cart-badge">
Carrello <span id="cart-count">0</span>
</a>

<div class="hero">
<div class="overlay"></div>

<div class="hero-content">
<h1>AL DOGE</h1>
<div class="subtitle">
Ordina online. pizza tradizionale e panini gourmet.
</div>

<a href="pizze.html" class="btn btn-gold">
Ordina Pizze
</a>

<section class="panini-spotlight" aria-label="Spotlight panini premium">
<div class="panini-copy">
<h2>Panini gourmet firmati AL DOGE</h2>
<p>Un morso, e capisci la differenza: ingredienti selezionati e gusto che resta in mente.</p>
</div>
<a href="chatbot.html" class="panini-cta">Scopri i nostri panini</a>
</section>

</div>
</div>

<footer>
© 2026 AL DOGE – Via S. Daniele 3, Farla di Majano
</footer>

<script src="cart-utils.js"></script>
<script>
updateCartBadge();
</script>

</body>
</html>

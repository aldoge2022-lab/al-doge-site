<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Pizze - AL DOGE</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --gold: #b99c62;
      --gold-soft: #d2ba7c;
      --dark: #080706;
      --soft: #15130f;
      --text: #f3ead9;
      --muted: #b8ad9b;
      --line: rgba(185, 156, 98, 0.20);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(185, 156, 98, 0.06), transparent 34%),
        linear-gradient(180deg, #050403 0%, var(--dark) 42%, #0d0b08 100%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding-bottom: 100px;
    }

    .logo-fixed {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 999;
      width: 62px;
      height: 62px;
      object-fit: cover;
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      border: 1px solid rgba(185, 156, 98, 0.28);
      cursor: pointer;
      background: #0d0b08;
    }

    .mobile-home-link {
      position: fixed;
      top: 18px;
      left: 90px;
      z-index: 999;
      min-height: 42px;
      display: flex;
      align-items: center;
      padding: 9px 13px;
      border: 1px solid rgba(185, 156, 98, 0.28);
      background: rgba(8, 7, 6, 0.88);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
    }

    .cart-fixed {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 999;
      background: var(--gold);
      color: black;
      width: 58px;
      height: 58px;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.36);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .cart-fixed:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.44);
    }

    .cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #7f1d1d;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      border: 2px solid #080808;
    }

    header {
      padding: 115px 20px 46px;
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(185, 156, 98, 0.11), transparent 42%),
        linear-gradient(180deg, #15130f 0%, var(--dark) 100%);
      border-bottom: 1px solid rgba(185, 156, 98, 0.14);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--gold-soft);
      font-size: clamp(42px, 6vw, 64px);
      margin-bottom: 10px;
      letter-spacing: -0.03em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .menu-mode-note {
      max-width: 820px;
      margin: 18px auto 0;
      border: 1px solid rgba(185, 156, 98, 0.18);
      background: rgba(0,0,0,0.22);
      padding: 14px 18px;
      color: #ddd2bf;
      font-size: 14px;
      line-height: 1.55;
    }

    .controls {
      max-width: 1200px;
      margin: 30px auto 18px;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 13px 20px;
      border-radius: 0;
      border: 1px solid rgba(185, 156, 98, 0.28);
      background: rgba(21, 19, 15, 0.88);
      color: var(--text);
      font-size: 15px;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .search-box input:focus {
      border-color: rgba(185, 156, 98, 0.62);
      box-shadow: 0 0 0 4px rgba(185, 156, 98, 0.08);
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .filter-btn {
      padding: 12px 20px;
      border-radius: 0;
      border: 1px solid rgba(185, 156, 98, 0.26);
      background: rgba(21, 19, 15, 0.72);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--gold);
      color: black;
      border-color: var(--gold);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    .menu-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 22px;
      align-items: start;
    }

    .pizza-card {
      background: linear-gradient(180deg, rgba(24,22,18,0.96), rgba(12,10,8,0.98));
      border-radius: 0;
      padding: 26px;
      border: 1px solid var(--line);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      align-self: start;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.22);
      position: relative;
      overflow: hidden;
    }

    .pizza-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(185, 156, 98, 0.06), transparent 38%);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .pizza-card:hover {
      transform: translateY(-3px);
      border-color: rgba(185, 156, 98, 0.48);
      box-shadow: 0 24px 58px rgba(0, 0, 0, 0.36), 0 0 34px rgba(185, 156, 98, 0.06);
    }

    .pizza-card:hover::before {
      opacity: 1;
    }

    .pizza-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 13px;
      position: relative;
      z-index: 1;
    }

    .pizza-name {
      font-family: 'Playfair Display', serif;
      color: var(--text);
      font-size: 25px;
      line-height: 1.05;
      font-weight: 700;
      flex: 1;
      letter-spacing: -0.015em;
    }

    .pizza-price {
      font-size: 20px;
      font-weight: 700;
      color: var(--gold-soft);
      white-space: nowrap;
      margin-left: 6px;
      padding: 6px 10px;
      border-radius: 0;
      background: rgba(185, 156, 98, 0.08);
      border: 1px solid rgba(185, 156, 98, 0.18);
    }

    .pizza-ingredients {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.72;
      margin-bottom: 14px;
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .pizza-allergeni {
      font-size: 11px;
      color: rgba(200, 190, 170, 0.78);
      background: rgba(255,255,255,0.035);
      border-left: 2px solid rgba(185, 156, 98, 0.34);
      padding: 7px 9px;
      margin-bottom: 15px;
      line-height: 1.45;
      position: relative;
      z-index: 1;
    }

    .pizza-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: auto;
      position: relative;
      z-index: 1;
    }

    .pizza-variants {
      margin-bottom: 15px;
      padding: 14px;
      border-radius: 0;
      background: rgba(0, 0, 0, 0.20);
      border: 1px solid rgba(185, 156, 98, 0.14);
      position: relative;
      z-index: 1;
    }

    .variant-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 11px;
    }

    .variant-group label {
      display: block;
      font-size: 11px;
      color: var(--gold-soft);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .variant-group select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 0;
      border: 1px solid rgba(185, 156, 98, 0.24);
      background: #090807;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .variant-group select:focus {
      border-color: rgba(185, 156, 98, 0.58);
    }

    .variant-extras {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 9px;
    }

    .extra-category {
      border: 1px solid rgba(185, 156, 98, 0.18);
      border-radius: 0;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.13);
    }

    .extra-category-toggle {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    .extra-category-toggle span {
      color: var(--muted);
      font-size: 12px;
    }

    .extra-category-toggle strong {
      font-size: 15px;
      line-height: 1;
      color: var(--gold-soft);
    }

    .extra-category.open .extra-category-toggle {
      background: rgba(185, 156, 98, 0.08);
    }

    .extra-ingredients-list {
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      padding: 0 10px 10px;
    }

    .extra-category.open .extra-ingredients-list {
      display: grid;
    }

    .extra-ingredient-btn {
      border: 1px solid rgba(185, 156, 98, 0.20);
      background: rgba(0, 0, 0, 0.24);
      color: var(--text);
      border-radius: 0;
      padding: 7px 10px;
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .extra-ingredient-btn:hover {
      border-color: rgba(185, 156, 98, 0.5);
      background: rgba(185, 156, 98, 0.09);
    }

    .selected-extras-chips {
      margin-top: 2px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 22px;
    }

    .extra-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(185, 156, 98, 0.34);
      background: rgba(185, 156, 98, 0.10);
      color: var(--text);
      border-radius: 0;
      padding: 5px 9px;
      font-size: 11px;
      line-height: 1;
    }

    .extra-chip-remove {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      line-height: 1;
    }

    .selected-extras-empty {
      color: rgba(184, 177, 163, 0.7);
      font-size: 12px;
      font-style: italic;
    }

    .variant-total {
      color: var(--gold-soft);
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #080706;
      border-radius: 0;
      padding: 5px;
      border: 1px solid rgba(185, 156, 98, 0.14);
    }

    .qty-btn {
      width: 31px;
      height: 31px;
      border-radius: 0;
      border: none;
      background: var(--gold);
      color: black;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .qty-display {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
    }

    .add-to-cart-btn {
      flex: 1;
      padding: 12px 18px;
      border-radius: 0;
      border: none;
      background: var(--gold);
      color: black;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 14px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .add-to-cart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(0,0,0,0.28);
    }

    .add-to-cart-btn:active {
      transform: scale(0.98);
    }

    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 18px;
    }

    @media (max-width: 768px) {
      .mobile-home-link { display: flex; }
      .menu-container {
        grid-template-columns: 1fr;
        padding: 18px;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-btn {
        width: 100%;
      }

      .extra-ingredients-list {
        grid-template-columns: 1fr;
      }

      .pizza-card {
        padding: 23px;
      }

      .variant-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <!-- Logo fisso -->
  <video class="logo-fixed" autoplay loop muted playsinline poster="logo-al-doge.png" onclick="window.location.href='index.html'" aria-label="AL DOGE"><source src="logo-animato.mp4" type="video/mp4"></video>
  <a class="mobile-home-link" href="index.html">← Home</a>

  <!-- Carrello fisso -->
  <div class="cart-fixed" onclick="window.location.href='carrello.html'" id="cart-icon" aria-label="Vai al carrello">
    🛒
    <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
  </div>

  <header>
    <h1>Menu Pizze</h1>
    <p class="subtitle">Puoi consultare il menù oppure personalizzare la pizza e aggiungerla al carrello.</p>
    <div class="menu-mode-note">Per tornare alla pagina principale usa il pulsante <strong>Home</strong> in alto. Il carrello resta disponibile in alto a destra.</div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Cerca pizza per nome o ingrediente...">
    </div>
    <button class="filter-btn active" data-filter="all">Tutte</button>
    <button class="filter-btn" data-filter="classica">Classiche</button>
    <button class="filter-btn" data-filter="speciale">Speciali</button>
    <button class="filter-btn" data-filter="piccante">Piccanti</button>
  </div>

  <div class="menu-container" id="menu-container">
    <!-- Le pizze verranno caricate dinamicamente -->
  </div>

  <div class="no-results" id="no-results" style="display: none;">
    Nessuna pizza trovata con i criteri selezionati.
  </div>

  <script src="pizza-pricing.js"></script>
  <script>
    let allPizzas = [];
    let currentFilter = 'all';
    let searchTerm = '';
    const pizzaExtrasState = {};

    const EXTRA_CATEGORIES = Object.freeze([
      {
        key: 'verdure',
        label: 'Verdure',
        priceLabel: '+€1,50',
        ingredients: [
          'Funghi freschi',
          'Funghi porcini',
          'Carciofi',
          'Peperoni',
          'Cipolla',
          'Patate al forno',
          'Patatine',
          'Rucola',
          'Pomodorini',
          'Zucchine',
          'Spinaci',
          'Radicchio di Treviso',
          'Melanzane',
          'Asparagi',
          'Fagioli',
          'Olive nere',
          'Olive verdi',
          'Olive taggiasche',
          'Pomodori secchi',
          'Capperi',
          'Friarielli',
          'Noci'
        ]
      },
      {
        key: 'affettati',
        label: 'Affettati',
        priceLabel: '+€2,00',
        ingredients: [
          'Prosciutto cotto',
          'Prosciutto crudo San Daniele',
          'Bresaola',
          'Speck',
          'Pancetta',
          'Salamino piccante',
          'Wurstel',
          'Salsiccia',
          'Salame dolce',
          'Petto d\'oca',
          'Acciughe',
          'Tonno',
          'Salmone',
          'Salmone affumicato',
          'Gamberetti',
          'Frutti di mare'
        ]
      },
      {
        key: 'burrata-bufala',
        label: 'Burrata / bufala',
        priceLabel: '+€3,00',
        ingredients: [
          'Burrata',
          'Mozzarella di bufala'
        ]
      }
    ]);

    const EXTRA_CATEGORY_MAP = EXTRA_CATEGORIES.reduce((acc, category) => {
      acc[category.key] = category;
      return acc;
    }, {});

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getPizzaExtrasState(pizzaName) {
      if (!pizzaExtrasState[pizzaName]) {
        pizzaExtrasState[pizzaName] = {
          openCategory: null,
          selectedExtras: [],
          format: 'normale',
          dough: 'normale'
        };
      }
      return pizzaExtrasState[pizzaName];
    }

    function renderExtraCategories(pizzaName, pizzaKey) {
      const state = getPizzaExtrasState(pizzaName);

      return EXTRA_CATEGORIES.map((category) => {
        const isOpen = state.openCategory === category.key;
        return `
          <div class="extra-category ${isOpen ? 'open' : ''}" id="extra-category-${pizzaKey}-${category.key}">
            <button type="button" class="extra-category-toggle" onclick="toggleExtraCategory('${pizzaName}', '${category.key}')">
              <span>${category.label} (${category.priceLabel})</span>
              <strong>${isOpen ? '−' : '+'}</strong>
            </button>
            <div class="extra-ingredients-list" id="extra-list-${pizzaKey}-${category.key}">
              ${category.ingredients.map((ingredient, index) => `
                <button
                  type="button"
                  class="extra-ingredient-btn"
                  onclick="selectExtraIngredient('${pizzaName}', '${category.key}', ${index})"
                  title="${escapeHtml(ingredient)}"
                >${escapeHtml(ingredient)}</button>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderSelectedExtrasChips(pizzaName) {
      const state = getPizzaExtrasState(pizzaName);
      if (!state.selectedExtras.length) {
        return '<span class="selected-extras-empty">Nessuna aggiunta selezionata</span>';
      }

      return state.selectedExtras.map((extra, index) => `
        <span class="extra-chip">
          ${escapeHtml(extra.name)}
          <button type="button" class="extra-chip-remove" onclick="removeExtraIngredient('${pizzaName}', ${index})" aria-label="Rimuovi ${escapeHtml(extra.name)}">×</button>
        </span>
      `).join('');
    }

    function calculateSelectionFinalPrice(basePrice, selectedVariant) {
      const formatSurcharge = PizzaPricing.FORMAT_SURCHARGES[selectedVariant.format] || 0;
      const doughSurcharge = PizzaPricing.DOUGH_SURCHARGES[selectedVariant.dough] || 0;
      const extrasSurcharge = selectedVariant.selectedExtras.reduce((sum, extra) => {
        return sum + (PizzaPricing.EXTRA_SURCHARGES[extra.categoryKey] || 0);
      }, 0);

      return basePrice + formatSurcharge + doughSurcharge + extrasSurcharge;
    }

    // Carica catalogo ufficiale
    async function loadMenu() {
      try {
        const response = await fetch('/.netlify/functions/catalog');
        const data = await response.json();
        allPizzas = Array.isArray(data.items) ? data.items : [];
        displayPizzas();
      } catch (error) {
        console.error('Errore caricamento catalogo:', error);
        document.getElementById('menu-container').innerHTML = 
          '<p style="text-align: center; color: var(--muted);">Errore nel caricamento del catalogo</p>';
      }
    }

    // Visualizza pizze
    function displayPizzas() {
      const container = document.getElementById('menu-container');
      const noResults = document.getElementById('no-results');
      
      let filtered = allPizzas;
      
      // Filtra per categoria
      if (currentFilter !== 'all') {
        filtered = filtered.filter(p => p.category === currentFilter);
      }
      
      // Filtra per ricerca
      if (searchTerm) {
        filtered = filtered.filter(p => 
          p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          p.ingredients.some(ing => ing.toLowerCase().includes(searchTerm.toLowerCase()))
        );
      }
      
      if (filtered.length === 0) {
        container.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      container.innerHTML = filtered.map((pizza) => {
        const pizzaKey = getPizzaKey(pizza.name);
        const state = getPizzaExtrasState(pizza.name);
        return `
          <div class="pizza-card" data-pizza-id="${pizza.id}">
            <div class="pizza-header">
              <h3 class="pizza-name">${pizza.name}</h3>
              <div class="pizza-price" id="price-${pizzaKey}">€${pizza.price.toFixed(2)}</div>
            </div>
            <div class="pizza-ingredients">${pizza.ingredients.join(', ')}</div>
            <div class="pizza-allergeni">Allergeni: ${pizza.allergens.join(', ')}</div>
            <div class="pizza-variants">
              <div class="variant-grid">
                <div class="variant-group">
                  <label for="format-${pizzaKey}">Formato</label>
                  <select id="format-${pizzaKey}" onchange="handleFormatChange('${pizza.name}', this.value)">
                    <option value="normale" ${state.format === 'normale' ? 'selected' : ''}>Normale (prezzo base)</option>
                    <option value="maxi" ${state.format === 'maxi' ? 'selected' : ''}>Maxi (+€5,00)</option>
                  </select>
                </div>
                <div class="variant-group">
                  <label for="dough-${pizzaKey}">Impasto</label>
                  <select id="dough-${pizzaKey}" onchange="handleDoughChange('${pizza.name}', this.value)">
                    <option value="normale" ${state.dough === 'normale' ? 'selected' : ''}>Normale (+€0,00)</option>
                    <option value="farina-di-riso" ${state.dough === 'farina-di-riso' ? 'selected' : ''}>Farina di riso (+€1,50)</option>
                    <option value="kamut" ${state.dough === 'kamut' ? 'selected' : ''}>Kamut (+€1,50)</option>
                  </select>
                </div>
              </div>
              <div class="variant-extras">
                ${renderExtraCategories(pizza.name, pizzaKey)}
                <div class="selected-extras-chips" id="selected-extras-${pizzaKey}">
                  ${renderSelectedExtrasChips(pizza.name)}
                </div>
              </div>
              <div class="variant-total" id="variant-total-${pizzaKey}">Prezzo selezione: €${pizza.price.toFixed(2)}</div>
            </div>
            <div class="pizza-actions">
              <div class="quantity-control">
                <button class="qty-btn" onclick="changeQuantity('${pizza.name}', -1)">−</button>
                <span class="qty-display" id="qty-${pizzaKey}">${quantities[pizza.name] || 1}</span>
                <button class="qty-btn" onclick="changeQuantity('${pizza.name}', 1)">+</button>
              </div>
              <button class="add-to-cart-btn" onclick="addToCart('${pizza.name}', event)">
                🛒 Aggiungi
              </button>
            </div>
          </div>
        `;
      }).join('');

      filtered.forEach((pizza) => updatePizzaSelectionPrice(pizza.name));
    }

    // Gestione quantità
    const quantities = {};

    function getPizzaKey(pizzaName) {
      return btoa(encodeURIComponent(pizzaName)).replace(/=+$/g, '');
    }

    function getSelectedVariant(pizzaName) {
      const state = getPizzaExtrasState(pizzaName);

      return {
        format: state.format || 'normale',
        dough: state.dough || 'normale',
        extras: state.selectedExtras.map((extra) => extra.categoryKey),
        selectedExtras: state.selectedExtras.map((extra) => ({ ...extra })),
        extraIngredients: state.selectedExtras.map((extra) => extra.name)
      };
    }

    function updatePizzaSelectionPrice(pizzaName) {
      const pizza = allPizzas.find((item) => item.name === pizzaName);
      if (!pizza || !window.PizzaPricing) return;

      const pizzaKey = getPizzaKey(pizzaName);
      const selectedVariant = getSelectedVariant(pizzaName);
      const finalPrice = calculateSelectionFinalPrice(pizza.price, selectedVariant);
      const headerPrice = document.getElementById(`price-${pizzaKey}`);
      const variantPrice = document.getElementById(`variant-total-${pizzaKey}`);

      if (headerPrice) {
        headerPrice.textContent = `€${finalPrice.toFixed(2)}`;
      }

      if (variantPrice) {
        variantPrice.textContent = `Prezzo selezione: €${finalPrice.toFixed(2)}`;
      }
    }

    function toggleExtraCategory(pizzaName, categoryKey) {
      const state = getPizzaExtrasState(pizzaName);
      state.openCategory = state.openCategory === categoryKey ? null : categoryKey;
      displayPizzas();
    }

    function handleFormatChange(pizzaName, formatValue) {
      const state = getPizzaExtrasState(pizzaName);
      state.format = formatValue || 'normale';
      updatePizzaSelectionPrice(pizzaName);
    }

    function handleDoughChange(pizzaName, doughValue) {
      const state = getPizzaExtrasState(pizzaName);
      state.dough = doughValue || 'normale';
      updatePizzaSelectionPrice(pizzaName);
    }

    function selectExtraIngredient(pizzaName, categoryKey, ingredientIndex) {
      const category = EXTRA_CATEGORY_MAP[categoryKey];
      if (!category) return;

      const ingredientName = category.ingredients[ingredientIndex];
      if (!ingredientName) return;

      const state = getPizzaExtrasState(pizzaName);
      const alreadySelected = state.selectedExtras.some((extra) => extra.name === ingredientName);

      if (!alreadySelected) {
        state.selectedExtras.push({
          categoryKey,
          name: ingredientName
        });
      }

      state.openCategory = null;
      displayPizzas();
    }

    function removeExtraIngredient(pizzaName, extraIndex) {
      const state = getPizzaExtrasState(pizzaName);
      state.selectedExtras = state.selectedExtras.filter((_, index) => index !== extraIndex);
      displayPizzas();
    }
    
    function changeQuantity(pizzaName, delta) {
      const id = getPizzaKey(pizzaName);
      if (!quantities[pizzaName]) quantities[pizzaName] = 1;
      
      quantities[pizzaName] = Math.max(1, Math.min(99, quantities[pizzaName] + delta));
      document.getElementById(`qty-${id}`).textContent = quantities[pizzaName];
    }

    // Aggiungi al carrello
    function addToCart(pizzaName, event) {
      const pizza = allPizzas.find(p => p.name === pizzaName);
      if (!pizza) return;
      
      const quantity = quantities[pizzaName] || 1;
      const selectedVariant = getSelectedVariant(pizzaName);
      const variantLabels = PizzaPricing.getVariantLabels({
        format: selectedVariant.format,
        dough: selectedVariant.dough,
        extras: []
      });
      const finalPrice = calculateSelectionFinalPrice(pizza.price, selectedVariant);
      const extrasSignature = selectedVariant.selectedExtras
        .map((extra) => `${extra.categoryKey}:${extra.name}`)
        .join('|') || 'Nessuno';
      const variantSignature = `${variantLabels.format}::${variantLabels.dough}::${extrasSignature}`;
      
      // Recupera carrello esistente
      let cart = JSON.parse(localStorage.getItem('aldoge_cart') || '[]');
      
      // Cerca se la pizza è già nel carrello
      const existingIndex = cart.findIndex(item =>
        item.type === 'pizza' &&
        item.name === pizzaName &&
        (item.variantSignature || PizzaPricing.DEFAULT_VARIANT_SIGNATURE) === variantSignature
      );
      
      if (existingIndex !== -1) {
        // Aggiorna quantità
        cart[existingIndex].quantity += quantity;
      } else {
        // Aggiungi nuovo item
        cart.push({
          type: 'pizza',
          name: pizzaName,
          basePrice: pizza.price,
          format: variantLabels.format,
          dough: variantLabels.dough,
          extras: selectedVariant.extraIngredients,
          variantSignature,
          price: finalPrice,
          ingredients: pizza.ingredients,
          allergeni: pizza.allergens,
          quantity: quantity
        });
      }
      
      // Salva carrello
      localStorage.setItem('aldoge_cart', JSON.stringify(cart));
      
      // Reset quantità
      quantities[pizzaName] = 1;
      const id = getPizzaKey(pizzaName);
      document.getElementById(`qty-${id}`).textContent = '1';
      
      // Feedback visivo
      const btn = event ? event.target : null;
      if (btn) {
        const originalText = btn.innerHTML;
        btn.innerHTML = '✓ Aggiunto!';
        btn.style.background = '#2f5f3a';
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.style.background = '';
        }, 1500);
      }
      
      updateCartBadge();
    }

    // Aggiorna badge carrello
    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem('aldoge_cart') || '[]');
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const badge = document.getElementById('cart-badge');
      
      if (totalItems > 0) {
        badge.textContent = totalItems;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }

    // Gestione filtri
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        displayPizzas();
      });
    });

    // Gestione ricerca
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchTerm = e.target.value;
      displayPizzas();
    });

    // Inizializza
    loadMenu();
    updateCartBadge();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prenota un tavolo - AL DOGE</title>
<meta name="description" content="Prenota un tavolo da AL DOGE a Farla di Majano.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#060504;--panel:#11100d;--cream:#f3ead9;--muted:#b8ad9b;--line:rgba(185,156,98,.28);--line2:rgba(185,156,98,.48);--gold:#b99c62;--gold2:#d2ba7c;--danger:#b33a2f;--ok:#8fae45}*{box-sizing:border-box;margin:0;padding:0}body{background:radial-gradient(circle at 70% 10%,rgba(185,156,98,.12),transparent 30%),#050403;color:var(--cream);font-family:Inter,sans-serif;min-height:100vh}a{text-decoration:none;color:inherit}.topbar{position:sticky;top:0;z-index:20;background:rgba(8,7,6,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand video{width:48px;height:48px;object-fit:cover;border:1px solid var(--line2);background:#0d0b08;border-radius:12px}.brand strong{display:block;font-family:'Playfair Display',serif;color:var(--gold2);font-size:23px}.brand span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.nav a{border:1px solid var(--line);padding:9px 12px;font-size:13px;font-weight:800;border-radius:999px;background:rgba(0,0,0,.18)}.page{max-width:1080px;margin:0 auto;padding:38px 18px 54px}.hero{display:grid;grid-template-columns:.72fr 1.28fr;gap:24px;align-items:start}.intro{border:1px solid var(--line);background:linear-gradient(180deg,rgba(24,21,17,.92),rgba(9,8,6,.96));border-radius:26px;padding:28px;box-shadow:0 22px 70px rgba(0,0,0,.35)}.kicker{color:var(--gold2);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.18em;margin-bottom:12px}.intro h1{font-family:'Playfair Display',serif;font-size:clamp(38px,5vw,62px);line-height:.98;color:var(--gold2)}.form-card{border:1px solid var(--line2);background:linear-gradient(180deg,rgba(20,18,14,.95),rgba(8,7,5,.98));border-radius:26px;padding:24px;box-shadow:0 28px 80px rgba(0,0,0,.45)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}label{display:block;color:var(--gold2);font-weight:900;font-size:13px;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid rgba(185,156,98,.34);background:rgba(0,0,0,.34);color:var(--cream);border-radius:14px;padding:13px 13px;font:inherit;outline:none}select option{background:#11100d;color:#f3ead9}textarea{min-height:96px;resize:vertical}.consent{grid-column:1/-1;border:1px solid rgba(185,156,98,.24);background:rgba(0,0,0,.18);border-radius:16px;padding:13px;display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:12px;line-height:1.45}.consent input{width:18px;height:18px;margin-top:1px;accent-color:var(--gold)}.consent strong{color:var(--cream)}.actions{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.submit{border:0;border-radius:16px;background:linear-gradient(135deg,#d2ba7c,#b99c62);color:#080706;padding:15px 20px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 14px 34px rgba(185,156,98,.22)}.submit:disabled{opacity:.6;cursor:not-allowed}.call{border:1px solid var(--line2);border-radius:16px;padding:14px 18px;font-weight:900;color:var(--gold2);background:rgba(0,0,0,.22)}.status{margin-top:14px;border-radius:14px;padding:12px 13px;display:none;font-weight:800;line-height:1.45}.status.ok{display:block;border:1px solid rgba(143,174,69,.55);background:rgba(143,174,69,.13);color:#dcebb9}.status.err{display:block;border:1px solid rgba(179,58,47,.55);background:rgba(179,58,47,.12);color:#ffd1cb}.small{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.45}footer{padding:24px 18px;text-align:center;color:rgba(244,234,216,.62);font-size:13px;border-top:1px solid var(--line)}
@media(max-width:860px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.nav{justify-content:flex-start}.page{padding-top:22px}.intro,.form-card{padding:20px;border-radius:20px}.intro h1{font-size:38px}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html" aria-label="AL DOGE home"><video autoplay muted loop playsinline poster="logo-al-doge.png"><source src="logo-animato.mp4" type="video/mp4"></video><div><strong>AL DOGE</strong><span>Prenota un tavolo</span></div></a><nav class="nav"><a href="index.html">Home</a><a href="menu-semplice.html">Menù</a><a href="panini-custom.html?v=panini-live2">Panini</a><a href="tel:+3904321840683">Chiama</a></nav></header>
<main class="page"><section class="hero"><div class="intro"><div class="kicker">Prenotazione</div><h1>Prenota un tavolo</h1></div><form class="form-card" id="bookingForm"><div class="grid"><div class="field"><label for="name">Nome</label><input id="name" name="name" autocomplete="name" required placeholder="Nome e cognome"></div><div class="field"><label for="phone">Telefono</label><input id="phone" name="phone" autocomplete="tel" required placeholder="Numero di telefono"></div><div class="field"><label for="date">Data</label><input id="date" name="date" type="date" required></div><div class="field"><label for="time">Orario</label><select id="time" name="time" required><option value="">Seleziona orario</option><option value="18:30">18:30</option><option value="19:00">19:00</option><option value="19:30">19:30</option><option value="20:00">20:00</option><option value="20:30">20:30</option><option value="21:00">21:00</option><option value="21:30">21:30</option><option value="22:00">22:00</option></select></div><div class="field"><label for="people">Persone</label><input id="people" name="people" type="number" min="1" max="30" value="2" required></div><div class="field"><label for="zone">Zona preferita</label><select id="zone" name="zone" required><option value="Indifferente">Indifferente</option><option value="Sala interna">Sala interna</option><option value="Giardino">Giardino</option></select></div><div class="field full"><label for="notes">Note</label><textarea id="notes" name="notes" placeholder="Esempio: passeggino, compleanno, intolleranze..."></textarea></div><label class="consent"><input id="contactConsent" name="contactConsent" type="checkbox"><span><strong>Comunicazioni da AL DOGE</strong><br>Acconsento a ricevere in futuro comunicazioni da AL DOGE. Scelta facoltativa.</span></label></div><div class="actions"><button class="submit" id="submitBtn" type="submit">Invia richiesta</button><a class="call" href="tel:+3904321840683">Chiama</a></div><div id="status" class="status"></div><p class="small">La prenotazione sarà confermata dal locale.</p></form></section></main>
<footer>© 2026 AL DOGE – Via San Daniele 3, Farla di Majano · Tel. 0432 1840683</footer>
<script>
const form=document.getElementById('bookingForm');const statusEl=document.getElementById('status');const submitBtn=document.getElementById('submitBtn');
const today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());document.getElementById('date').min=today.toISOString().slice(0,10);
function showStatus(type,text){statusEl.className='status '+type;statusEl.textContent=text;}
form.addEventListener('submit',async function(event){event.preventDefault();submitBtn.disabled=true;showStatus('ok','Invio richiesta in corso...');const data={name:form.name.value.trim(),phone:form.phone.value.trim(),date:form.date.value,time:form.time.value,people:form.people.value,zone:form.zone.value,notes:form.notes.value.trim(),contactConsent:form.contactConsent.checked};try{const response=await fetch('/.netlify/functions/booking-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!response.ok){throw new Error('Errore invio richiesta');}showStatus('ok','Richiesta inviata. La prenotazione sarà confermata dal locale.');form.reset();document.getElementById('people').value='2';}catch(error){showStatus('err','Non sono riuscito a inviare la richiesta. Chiama il locale al 0432 1840683.');}finally{submitBtn.disabled=false;}});
</script>
</body>
</html>
